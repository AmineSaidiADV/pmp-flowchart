<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMP 49 Processes — PMBOK 6th Edition Interactive Reference</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #21262d;
  --border: #30363d; --text: #c9d1d9; --text2: #8b949e;
  --accent: #58a6ff; --gold: #f0b429; --gold2: #ffd700;
  --green: #3fb950; --red: #f85149; --purple: #bc8cff;
  --node-text: #fff; --band-label: rgba(255,255,255,0.5);
  --shadow: 0 4px 20px rgba(0,0,0,0.5);
  --panel-w: 380px;
  --header-h: 52px; --strip-h: 48px;
}
[data-theme="light"] {
  --bg: #f6f8fa; --bg2: #ffffff; --bg3: #eaeef2;
  --border: #d0d7de; --text: #1f2328; --text2: #57606a;
  --node-text: #fff; --band-label: rgba(0,0,0,0.4);
  --shadow: 0 4px 20px rgba(0,0,0,0.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;background:var(--bg);color:var(--text)}
button{cursor:pointer;border:none;background:none;color:inherit;font:inherit}
input{font:inherit}

/* ── HEADER ── */
#header{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:100;flex-shrink:0}
#header h1{font-size:15px;font-weight:700;white-space:nowrap;color:var(--text)}
#header .sub{font-size:11px;color:var(--text2);white-space:nowrap}
#view-tabs{display:flex;gap:4px;margin-left:auto}
.vtab{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;color:var(--text2);transition:all .15s}
.vtab:hover{background:var(--bg3);color:var(--text)}
.vtab.active{background:var(--accent);color:#fff}
#search{width:200px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px;outline:none}
#search:focus{border-color:var(--accent)}
#theme-btn{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);font-size:14px}
#reset-btn{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);font-size:11px;color:var(--text2)}
#reset-btn:hover{color:var(--text)}
#sidebar-toggle{padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);font-size:16px;flex-shrink:0}

/* ── MILESTONE STRIP ── */
#milestone-strip{height:var(--strip-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 8px;z-index:99;overflow-x:auto;gap:0;flex-shrink:0}
#milestone-strip::-webkit-scrollbar{height:4px}
#milestone-strip::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.mstone{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;transition:all .15s;flex-shrink:0;white-space:nowrap}
.mstone:hover{background:var(--bg3)}
.mstone.highlighted{background:rgba(240,180,41,0.2)}
.mstone-dot{width:20px;height:20px;background:var(--gold);transform:rotate(45deg);flex-shrink:0;border-radius:2px;display:flex;align-items:center;justify-content:center}
.mstone-dot span{transform:rotate(-45deg);font-size:8px;font-weight:700;color:#000}
.mstone-label{font-size:10px;color:var(--text2)}
.mstone-label strong{display:block;font-size:11px;color:var(--text)}
.mstone-sep{width:20px;height:2px;background:var(--border);flex-shrink:0}
#strip-toggle{margin-left:auto;flex-shrink:0;padding:4px 8px;border-radius:4px;border:1px solid var(--border);font-size:10px;background:var(--bg3);color:var(--text2)}

/* ── MAIN LAYOUT ── */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
#main-container{display:flex;flex:1;overflow:hidden;min-height:0}

/* ── SIDEBAR ── */
#sidebar{width:180px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:12px;transition:width .2s ease,padding .2s ease;overflow:hidden}
#sidebar.collapsed{width:0;padding:0;border-right:none}
#sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199}
#sidebar-close{display:none}
#sidebar::-webkit-scrollbar{width:4px}
#sidebar::-webkit-scrollbar-thumb{background:var(--border)}
.filter-section h4{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.chip-group{display:flex;flex-direction:column;gap:3px}
.chip{padding:4px 8px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--text2)}
.chip.active{border-color:currentColor;color:white;font-weight:500}
.chip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.display-opts{display:flex;flex-direction:column;gap:5px}
.display-opts label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);cursor:pointer}
.display-opts input[type=checkbox]{accent-color:var(--accent)}

/* ── CANVAS ── */
#canvas-container{flex:1;overflow:hidden;position:relative;min-height:0}
.view{display:none;position:absolute;inset:0;overflow:hidden}
.view.active{display:flex;flex-direction:column}

/* Flow view */
#view-flow{overflow:hidden}
#flow-svg-wrap{flex:1;min-height:0;overflow:hidden;cursor:grab}
#flow-svg-wrap:active{cursor:grabbing}
#no-d3{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text2);display:none}
.flow-controls{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:10}
.flow-controls button{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--bg2);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.flow-controls button:hover{background:var(--bg3)}

/* Matrix view */
#view-matrix{overflow:auto;flex-direction:column}
#view-matrix::-webkit-scrollbar{width:8px;height:8px}
#view-matrix::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#matrix-table{border-collapse:collapse;font-size:10px;min-width:max-content}
#matrix-table th,#matrix-table td{border:1px solid var(--border);padding:2px 4px;white-space:nowrap}
#matrix-table thead th{position:sticky;top:0;background:var(--bg2);z-index:5;font-weight:600;font-size:9px;writing-mode:vertical-rl;transform:rotate(180deg);min-height:80px;padding:4px 2px;color:var(--text)}
#matrix-table thead th:first-child{writing-mode:horizontal-tb;transform:none;min-width:160px;text-align:left;padding:4px 6px;z-index:6}
#matrix-table tbody tr:hover{background:var(--bg3)}
#matrix-table tbody td:first-child{position:sticky;left:0;background:var(--bg2);font-weight:500;min-width:160px;padding:3px 6px;z-index:4;border-right:2px solid var(--border)}
#matrix-table tbody td:first-child:hover{cursor:pointer;color:var(--accent)}
.cell-i{background:rgba(63,185,80,0.3);text-align:center;font-weight:600;color:#3fb950;cursor:pointer}
.cell-o{background:rgba(240,180,41,0.3);text-align:center;font-weight:600;color:var(--gold);cursor:pointer}
.cell-io{background:rgba(88,166,255,0.3);text-align:center;font-weight:600;color:var(--accent);cursor:pointer}
#matrix-legend{display:flex;align-items:center;gap:16px;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px}
.legend-box{width:16px;height:16px;border-radius:3px}

/* Timeline view */
#view-timeline{overflow:auto;flex-direction:column}
#view-timeline::-webkit-scrollbar{width:8px;height:8px}
#view-timeline::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#timeline-grid{display:grid;grid-template-columns:100px repeat(5, 1fr);min-width:900px;font-size:11px}
.tl-header{position:sticky;top:0;z-index:5;background:var(--bg2);border:1px solid var(--border);padding:6px 8px;font-weight:600;text-align:center}
.tl-ka-label{position:sticky;left:0;background:var(--bg2);border:1px solid var(--border);padding:6px 4px;font-weight:600;font-size:10px;display:flex;align-items:center;z-index:4}
.tl-cell{border:1px solid var(--border);padding:4px;display:flex;flex-direction:column;gap:3px;min-height:60px;vertical-align:top}
.tl-block{padding:3px 5px;border-radius:4px;font-size:10px;cursor:pointer;transition:all .15s;line-height:1.3;border:1px solid transparent}
.tl-block:hover{filter:brightness(1.2);border-color:white}
.tl-block .tid{font-size:9px;opacity:.7;font-weight:700}
.tl-milestone{padding:3px 6px;background:rgba(240,180,41,0.25);border:1px solid var(--gold);border-radius:4px;font-size:9px;color:var(--gold);font-weight:600;margin-top:2px}

/* KA Drill-down */
#view-ka{overflow-y:auto;padding:12px;gap:10px;flex-direction:column}
#view-ka::-webkit-scrollbar{width:8px}
#view-ka::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.ka-section{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.ka-header{padding:10px 14px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px}
.ka-header:hover{background:var(--bg3)}
.ka-title{display:flex;align-items:center;gap:8px;font-weight:600}
.ka-dot{width:12px;height:12px;border-radius:50%}
.ka-count{font-size:11px;color:var(--text2);font-weight:400}
.ka-chevron{transition:transform .2s;color:var(--text2)}
.ka-section.open .ka-chevron{transform:rotate(90deg)}
.ka-body{display:none;padding:0 14px 14px}
.ka-section.open .ka-body{display:block}
.ka-processes{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ka-proc{border:1px solid var(--border);border-radius:6px;overflow:hidden}
.ka-proc-header{padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:12px}
.ka-proc-header:hover{background:var(--bg3)}
.ka-proc-id{font-weight:700;min-width:28px;font-size:11px}
.ka-proc-name{flex:1;font-weight:500}
.ka-proc-group{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:500}
.ka-proc-body{display:none;padding:10px;background:var(--bg);border-top:1px solid var(--border)}
.ka-proc.open .ka-proc-body{display:block}
.itto-section{margin-bottom:8px}
.itto-section h5{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.itto-section.inputs h5{color:#3fb950}
.itto-section.tools h5{color:var(--accent)}
.itto-section.outputs h5{color:var(--gold)}
.itto-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.itto-list li{font-size:11px;color:var(--text2);padding:2px 0 2px 12px;position:relative;line-height:1.4}
.itto-list li::before{content:'•';position:absolute;left:0;color:var(--text2)}
.itto-list li.milestone-out{color:var(--gold);font-weight:600}
.itto-list li.milestone-out::before{content:'★';color:var(--gold)}

/* ── DETAIL PANEL ── */
#detail-panel{width:var(--panel-w);flex-shrink:0;background:var(--bg2);border-left:1px solid var(--border);overflow-y:auto;transition:margin-right .2s ease;display:flex;flex-direction:column}
#detail-panel.closed{margin-right:calc(-1 * var(--panel-w));pointer-events:none}
#detail-panel::-webkit-scrollbar{width:6px}
#detail-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#panel-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:8px;flex-shrink:0;position:sticky;top:0;background:var(--bg2);z-index:1}
#panel-close{flex-shrink:0;width:24px;height:24px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2)}
#panel-close:hover{background:var(--bg3);color:var(--text)}
#panel-title-wrap{flex:1}
#panel-id{font-size:11px;font-weight:700;color:var(--text2)}
#panel-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3}
#panel-meta{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.meta-badge{padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
#panel-body{padding:14px;flex:1}
#panel-purpose{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.5;padding:8px;background:var(--bg3);border-radius:6px;border-left:3px solid var(--accent)}
.panel-section{margin-bottom:14px}
.panel-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.panel-section.inputs .panel-section-title{color:#3fb950;border-color:rgba(63,185,80,0.3)}
.panel-section.tools .panel-section-title{color:var(--accent);border-color:rgba(88,166,255,0.3)}
.panel-section.outputs .panel-section-title{color:var(--gold);border-color:rgba(240,180,41,0.3)}
.panel-list{list-style:none;display:flex;flex-direction:column;gap:3px}
.panel-list li{font-size:12px;color:var(--text2);padding:3px 0 3px 14px;position:relative;line-height:1.4}
.panel-list li::before{content:'•';position:absolute;left:0;color:var(--border)}
.panel-list li.milestone{color:var(--gold);font-weight:600}
.panel-list li.milestone::before{content:'★';color:var(--gold)}
.milestone-tag{font-size:10px;background:rgba(240,180,41,0.2);border:1px solid var(--gold);padding:1px 5px;border-radius:3px;margin-left:4px}
#panel-nav{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--border);flex-shrink:0}
#panel-nav button{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);font-size:11px;color:var(--text2)}
#panel-nav button:hover{color:var(--text);border-color:var(--text2)}

/* ── MOBILE ── */
@media(max-width:768px){
  #header{gap:6px;padding:0 8px;flex-wrap:wrap;height:auto;min-height:var(--header-h)}
  #header h1{font-size:13px}
  #header .sub{display:none}
  #view-tabs{order:10;width:100%;gap:2px;padding-bottom:4px}
  .vtab{padding:4px 6px;font-size:11px;flex:1;text-align:center}
  #search{width:120px;font-size:11px}
  #app{height:100dvh}
  #sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;width:220px!important;padding:10px 8px!important;transform:translateX(-100%);transition:transform .2s ease;overflow-y:auto!important}
  #sidebar.mobile-open{transform:translateX(0)}
  #sidebar.collapsed{transform:translateX(-100%)}
  #sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:199}
  #sidebar-overlay.visible{display:block}
  #sidebar-close{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);font-size:12px;color:var(--text2);width:100%}
  #sidebar-close:hover{color:var(--text)}
  #milestone-strip{display:none}
  .flow-controls{bottom:12px;right:8px}
  #detail-panel{position:fixed;inset:0;width:100%!important;margin:0!important;z-index:300;border-radius:0}
  #detail-panel.closed{display:none}
  :root{--panel-w:100%}
}
@media(max-width:480px){
  #search{width:90px}
  .vtab{font-size:10px;padding:3px 4px}
}

/* ── TOOLTIP ── */
#tooltip{position:fixed;pointer-events:none;background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:11px;color:var(--text);z-index:9999;opacity:0;transition:opacity .1s;max-width:220px;line-height:1.5;box-shadow:var(--shadow)}
#tooltip strong{display:block;font-size:12px;color:var(--text);margin-bottom:2px}
#tooltip .tip-ka{color:var(--text2);font-size:10px}
#tooltip .tip-pg{font-size:10px;font-weight:600}

/* ── ITTO CLICKABLE ITEMS ── */
.itto-item{cursor:pointer;border-radius:4px;transition:background .1s;display:list-item;padding-right:18px;position:relative}
.itto-item:hover{background:var(--bg3)}
.itto-hint{position:absolute;right:2px;top:50%;transform:translateY(-50%);font-size:9px;color:var(--text2);opacity:.45;pointer-events:none;font-style:normal}
.itto-item:hover .itto-hint{opacity:1;color:var(--accent)}
.itto-tap-hint{font-size:9px;font-weight:400;color:var(--text2);opacity:.5;text-transform:none;letter-spacing:0;margin-left:6px}
.itto-card{margin:2px 0 4px 12px;padding:8px 10px;background:var(--bg3);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;font-size:11px;line-height:1.5;animation:itto-in .15s ease}
.itto-card.type-input{border-color:#3fb950}
.itto-card.type-tool{border-color:var(--accent)}
.itto-card.type-output{border-color:var(--gold)}
.itto-card-inner{display:flex;gap:8px;align-items:flex-start}
.itto-card-icon{font-size:18px;flex-shrink:0;margin-top:1px}
.itto-card-what{color:var(--text);margin-bottom:4px;font-size:11px}
.itto-card-example{color:var(--text2);margin-top:4px;font-size:11px}
.itto-card-example em{color:var(--accent);font-style:normal;font-weight:600}
.itto-card-tip{color:var(--text2);margin-top:4px;font-size:10px;padding-top:4px;border-top:1px solid var(--border)}
.itto-card-tool-btn{display:inline-flex;align-items:center;gap:5px;margin-top:8px;padding:5px 10px;border-radius:6px;border:1px solid var(--accent);background:var(--accent)18;color:var(--accent);font-size:10px;font-weight:600;cursor:pointer;transition:background .15s;width:100%}
.itto-card-tool-btn:hover{background:var(--accent)35}
@keyframes itto-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
/* ── TOOL DETAIL MODAL ── */
.tool-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:9000;display:flex;align-items:center;justify-content:center;padding:16px;animation:tmFadeIn .15s}
.tool-modal-overlay.hidden{display:none!important}
@keyframes tmFadeIn{from{opacity:0}to{opacity:1}}
.tool-modal-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.55);animation:tmSlideUp .18s}
@keyframes tmSlideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.tool-modal-box::-webkit-scrollbar{width:6px}
.tool-modal-box::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tool-modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid var(--border)}
.tool-modal-header-text{flex:1;min-width:0}
.tool-modal-cat{font-size:10px;font-weight:600;margin-bottom:5px}
.tool-modal-name{font-size:17px;font-weight:700;color:var(--text);line-height:1.2}
.tool-modal-tagline{font-size:11px;color:var(--text2);margin-top:3px}
.tool-modal-close{background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;padding:0 0 0 12px;line-height:1;flex-shrink:0;margin-top:-2px}
.tool-modal-close:hover{color:var(--text)}
.tool-modal-visual{padding:12px 16px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;justify-content:center}
.tool-modal-visual svg{max-width:100%;height:auto}
.tool-modal-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.tool-modal-section{font-size:12px;line-height:1.65;color:var(--text2)}
.tool-modal-section strong{color:var(--text)}
.tool-modal-tip{background:var(--accent)12;border-left:3px solid var(--accent);border-radius:0 4px 4px 0;padding:8px 10px;font-size:11px;color:var(--text2)}
.tool-modal-usedin{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tool-modal-pid{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:10px;color:var(--text2)}

/* ── TOOLS VIEW ── */
#view-tools{overflow-y:auto;flex-direction:column;background:var(--bg)}
#view-tools::-webkit-scrollbar{width:8px}
#view-tools::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
#tools-toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#tools-search{flex:1;min-width:140px;max-width:260px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--text);font-size:12px;outline:none}
#tools-search:focus{border-color:var(--accent)}
#tools-cat-chips{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tcat-chip{padding:4px 10px;border-radius:14px;border:1px solid var(--border);background:var(--bg3);font-size:11px;color:var(--text2);cursor:pointer;transition:all .15s;white-space:nowrap}
.tcat-chip:hover{border-color:var(--text2);color:var(--text)}
.tcat-chip.active{color:#fff;font-weight:600}
#tools-count{font-size:11px;color:var(--text2);white-space:nowrap;flex-shrink:0}
#tools-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px;align-content:start}
@media(max-width:1100px){#tools-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){#tools-grid{grid-template-columns:1fr;padding:8px}}
.tool-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.tool-card:hover{border-color:var(--text2);box-shadow:0 4px 16px rgba(0,0,0,0.3)}
.tool-card.highlight{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)40;animation:card-hl .6s ease}
@keyframes card-hl{0%,100%{box-shadow:0 0 0 2px rgba(88,166,255,0.4)}50%{box-shadow:0 0 0 4px rgba(88,166,255,0.8)}}
.tool-card-head{padding:10px 12px 6px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.tool-cat-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;flex-shrink:0}
.tool-name{font-size:14px;font-weight:700;color:var(--text);line-height:1.3;margin-top:2px}
.tool-tagline{font-size:11px;color:var(--text2);padding:0 12px 6px;font-style:italic}
.tool-visual{background:var(--bg3);margin:0 12px 6px;border-radius:6px;overflow:hidden;min-height:110px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tool-visual svg{display:block;max-width:100%}
.tool-desc{font-size:11px;color:var(--text2);line-height:1.55;padding:0 12px 8px}
.tool-when{font-size:10px;color:var(--text2);padding:0 12px;margin-bottom:6px}
.tool-when strong{color:var(--text);font-size:10px}
.tool-tip{font-size:10px;color:var(--accent);padding:8px 12px;border-top:1px solid var(--border);background:rgba(88,166,255,0.05);line-height:1.4}
.tool-tip::before{content:'💡 '}
.tool-card[data-cat='data-gathering'] .tool-cat-badge{background:#3fb95022;color:#3fb950;border:1px solid #3fb95044}
.tool-card[data-cat='data-analysis'] .tool-cat-badge{background:#58a6ff22;color:#58a6ff;border:1px solid #58a6ff44}
.tool-card[data-cat='data-representation'] .tool-cat-badge{background:#f0b42922;color:#f0b429;border:1px solid #f0b42944}
.tool-card[data-cat='scheduling'] .tool-cat-badge{background:#bc8cff22;color:#bc8cff;border:1px solid #bc8cff44}
.tool-card[data-cat='estimating'] .tool-cat-badge{background:#f8514922;color:#f85149;border:1px solid #f8514944}
.tool-card[data-cat='interpersonal'] .tool-cat-badge{background:#79c0ff22;color:#79c0ff;border:1px solid #79c0ff44}
.tool-card[data-cat='governance'] .tool-cat-badge{background:#8b949e22;color:#8b949e;border:1px solid #8b949e44}
.tcat-chip[data-cat='data-gathering'].active{background:#3fb950;border-color:#3fb950}
.tcat-chip[data-cat='data-analysis'].active{background:#58a6ff;border-color:#58a6ff}
.tcat-chip[data-cat='data-representation'].active{background:#f0b429;border-color:#f0b429}
.tcat-chip[data-cat='scheduling'].active{background:#bc8cff;border-color:#bc8cff}
.tcat-chip[data-cat='estimating'].active{background:#f85149;border-color:#f85149}
.tcat-chip[data-cat='interpersonal'].active{background:#79c0ff;border-color:#79c0ff}
.tcat-chip[data-cat='governance'].active{background:#8b949e;border-color:#8b949e}
.tcat-chip[data-cat='all'].active{background:var(--accent);border-color:var(--accent)}
.tools-empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text2);font-size:13px}
.tool-name-row{padding:0 12px 4px}
.tool-what{font-size:11px;color:var(--text2);line-height:1.55;padding:0 12px 8px}
.tool-body{padding:0}
.tool-usedin{padding:4px 12px 6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:9.5px;color:var(--text2)}
.tool-pid{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:1px 5px;font-size:9px;color:var(--text2);font-family:monospace}

/* ── SVG styles (injected into inline SVG) ── */
.svg-node rect{transition:filter .15s,stroke-width .15s}
.svg-node:hover rect{filter:brightness(1.25);stroke-width:2px}
.svg-node.dimmed rect{opacity:.25}
.svg-node.dimmed text{opacity:.25}
.svg-node.highlighted rect{stroke:#fff!important;stroke-width:2.5px!important;filter:drop-shadow(0 0 6px rgba(255,255,255,0.4))}
.svg-edge{transition:opacity .1s}
.svg-edge.dimmed{opacity:.05}
.svg-edge.highlighted{opacity:1!important;stroke-width:2.5px!important}
.milestone-badge{cursor:pointer}
.milestone-badge:hover polygon{filter:brightness(1.3)}
</style>
</head>

<div id="app">

<!-- HEADER -->
<header id="header">
  <button id="sidebar-toggle" title="Toggle sidebar">☰</button>

    </div>
    <div id="view-timeline" class="view">
      <div id="timeline-grid"></div>
    </div>
    <div id="view-ka" class="view">
      <div id="ka-accordion"></div>
    </div>
    <div id="view-tools" class="view">

          <button class="tcat-chip" data-cat="data-gathering">Data Gathering</button>
          <button class="tcat-chip" data-cat="data-analysis">Data Analysis</button>
          <button class="tcat-chip" data-cat="data-representation">Data Representation</button>
          <button class="tcat-chip" data-cat="scheduling">Scheduling</button>
          <button class="tcat-chip" data-cat="estimating">Estimating</button>
          <button class="tcat-chip" data-cat="interpersonal">Interpersonal</button>
          <button class="tcat-chip" data-cat="governance">Governance</button>

        <span id="tools-count"></span>
      </div>
      <div id="tools-grid"></div>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div id="detail-panel" class="closed">
    <div id="panel-header">
      <button id="panel-close">✕</button>
      <div id="panel-title-wrap">

        <div id="panel-name"></div>
        <div id="panel-meta"></div>
      </div>
    </div>
    <div id="panel-body">
      <div id="panel-purpose"></div>
    </div>
    <div id="panel-nav">

      <button id="btn-next">Next →</button>

</div><!-- /main -->
</div><!-- /app -->

</div>

function getProcess(id) { return PROCESSES.find(p => p.id === id); }
function getMilestone(id) { return MILESTONES.find(m => m.id === id); }
function nodeColor(p) {
  if (state.colorByPG) return PG_COLOR[p.group]?.border?.replace('rgba(','').replace(')','').split(',').slice(0,3).join(',') || '#888';
  return KA_COLOR[p.ka] || '#555';
}
function visible(p) {
  return state.activeGroups.has(p.group) && state.activeKAs.has(p.ka);
}
function matchesSearch(p) {
  const q = state.searchQuery.toLowerCase();
  if (!q) return true;
  return p.id.includes(q) || p.name.toLowerCase().includes(q) ||
    p.inputs.some(i => i.toLowerCase().includes(q)) ||
    p.tools.some(t => t.toLowerCase().includes(q)) ||
    p.outputs.some(o => o.name.toLowerCase().includes(q));
}

function buildMilestoneStrip() {
  const inner = document.getElementById('ms-inner');
  MILESTONES.forEach((m, i) => {
    if (i > 0) {
      const sep = document.createElement('div');
      sep.className = 'mstone-sep';
      inner.appendChild(sep);
    }
    const el = document.createElement('div');
    el.className = 'mstone';
    el.dataset.id = m.id;
    el.innerHTML = `<div class="mstone-dot"><span>${m.id.replace('M','')}</span></div>
      <div class="mstone-label"><strong>${m.id}</strong>${m.name}</div>`;
    el.addEventListener('click', () => highlightMilestone(m.id));
    el.addEventListener('mouseenter', e => showTooltip(e, `<strong>${m.id}: ${m.name}</strong><br>${m.desc}<br><span class="tip-ka">Produced by: ${m.producedBy}</span>`));
    el.addEventListener('mouseleave', hideTooltip);
    inner.appendChild(el);
  });
  document.getElementById('strip-toggle').addEventListener('click', function() {
    const strip = document.getElementById('milestone-strip');
    if (strip.style.display === 'none') {
      strip.style.display = '';
      this.textContent = '▲ hide';
    } else {
      strip.style.display = 'none';
      this.textContent = '▼ show';
    }
  });

  // Sidebar toggle
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  const isMobile = () => window.innerWidth <= 768;
  document.getElementById('sidebar-toggle').addEventListener('click', () => {
    if (isMobile()) {
      const open = sidebar.classList.toggle('mobile-open');
      overlay.classList.toggle('visible', open);
    } else {
      sidebar.classList.toggle('collapsed');
    }
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('visible');
  });
  document.getElementById('sidebar-close').addEventListener('click', () => {
    sidebar.classList.remove('mobile-open');
    overlay.classList.remove('visible');
  });
}
function highlightMilestone(mid) {
  document.querySelectorAll('.mstone').forEach(el => el.classList.toggle('highlighted', el.dataset.id === mid));
  const m = getMilestone(mid);
  if (m) {
    const p = getProcess(m.producedBy);
    if (p) { highlightProcess(p.id); openPanel(p.id); }
  }
}

const tt = document.getElementById('tooltip');
function showTooltip(event, html) {
  tt.innerHTML = html;
  tt.style.opacity = '1';
  positionTooltip(event);
}
function positionTooltip(e) {
  const x = Math.min(e.clientX + 12, window.innerWidth - 240);
  const y = Math.min(e.clientY + 12, window.innerHeight - 120);
  tt.style.left = x + 'px';
  tt.style.top  = y + 'px';
}
function hideTooltip() { tt.style.opacity = '0'; }
document.addEventListener('mousemove', e => { if (tt.style.opacity === '1') positionTooltip(e); });

//  VIEW 1 — MASTER FLOW CHART (D3)
// ═══════════════════════════════════════════════════════════════════
function renderFlowchart() {
  if (typeof d3 === 'undefined') {
    document.getElementById('no-d3').style.display = 'flex';
    return;
  }
  const wrap = document.getElementById('flow-svg-wrap');
  wrap.innerHTML = '';

  const svg = d3.select(wrap).append('svg')
    .attr('width', '100%').attr('height', '100%')
    .attr('viewBox', `0 0 ${SVG_W} ${SVG_H}`)
    .style('overflow', 'visible');

  // Arrowhead marker
  const defs = svg.append('defs');
  defs.append('marker').attr('id','arr').attr('markerWidth',7).attr('markerHeight',5)
    .attr('refX',6).attr('refY',2.5).attr('orient','auto')
    .append('polygon').attr('points','0 0,7 2.5,0 5').attr('fill','#666');
  defs.append('marker').attr('id','arr-gold').attr('markerWidth',7).attr('markerHeight',5)
    .attr('refX',6).attr('refY',2.5).attr('orient','auto')
    .append('polygon').attr('points','0 0,7 2.5,0 5').attr('fill','#f0b429');
  defs.append('marker').attr('id','arr-hl').attr('markerWidth',7).attr('markerHeight',5)
    .attr('refX',6).attr('refY',2.5).attr('orient','auto')
    .append('polygon').attr('points','0 0,7 2.5,0 5').attr('fill','#fff');

  const root = svg.append('g').attr('class','root');

  // Zoom
  const zoom = d3.zoom().scaleExtent([0.08, 4])
    .on('zoom', e => root.attr('transform', e.transform));
  svg.call(zoom);
  state.zoom = zoom;
  state.zoomSvg = svg;

  const initTransform = d3.zoomIdentity.translate(20, 10).scale(0.52);
  svg.call(zoom.transform, initTransform);

  // ── Band backgrounds
  PG_ORDER.forEach(pg => {
    const cfg = BAND_CFG[pg];
    const keys = Object.keys(BAND_CFG);
    const idx = keys.indexOf(pg);
    const nextKey = keys[idx + 1];
    const bandH = nextKey ? BAND_CFG[nextKey].yTop - cfg.yTop : SVG_H - cfg.yTop;
    root.append('rect').attr('x', 0).attr('y', cfg.yTop)
      .attr('width', SVG_W).attr('height', bandH)
      .attr('fill', PG_COLOR[pg].bg).attr('rx', 0);
    // PG label
    root.append('text').attr('x', 10).attr('y', cfg.yTop + 18)
      .text(pg.toUpperCase()).attr('fill', PG_COLOR[pg].label)
      .attr('font-size', 11).attr('font-weight', 700).attr('opacity', 0.9)
      .attr('font-family', 'system-ui, sans-serif');
    // Bottom border line
    root.append('line').attr('x1',0).attr('y1',cfg.yTop).attr('x2',SVG_W).attr('y2',cfg.yTop)
      .attr('stroke', PG_COLOR[pg].border).attr('stroke-width', 1).attr('opacity', 0.5);
  });

  // ── Column headers
  const hdrG = root.append('g').attr('class','col-headers');
  KA_ORDER.forEach((ka, i) => {
    const cx = COL_X[ka];
    hdrG.append('rect').attr('x', cx - NODE_W/2 - 2).attr('y', 4)
      .attr('width', NODE_W + 4).attr('height', 42)
      .attr('rx', 6).attr('fill', KA_COLOR[ka]).attr('opacity', 0.85);
    hdrG.append('text').attr('x', cx).attr('y', 19)
      .text(ka.replace('Communications','Comms').replace('Procurement','Procurement').replace('Monitoring & Controlling','M&C'))
      .attr('text-anchor','middle').attr('fill','#fff').attr('font-size', 9.5)
      .attr('font-weight', 700).attr('font-family','system-ui,sans-serif');
    hdrG.append('text').attr('x', cx).attr('y', 34)
      .text('Management').attr('text-anchor','middle').attr('fill','rgba(255,255,255,0.7)')
      .attr('font-size', 8).attr('font-family','system-ui,sans-serif');
  });

  // ── Edges
  const edgeG = root.append('g').attr('class','edge-layer').attr('display', state.showEdges ? null : 'none');
  EDGES.forEach(e => {
    const s = POS[e.from], t = POS[e.to];
    if (!s || !t) return;
    const x1 = s.x, y1 = s.y + NODE_H/2;
    const x2 = t.x, y2 = t.y - NODE_H/2;
    const isFeedback = e.feedback;
    let path;
    if (isFeedback) {
      // Draw feedback loop to the left
      const lx = Math.min(x1, x2) - 60;
      path = `M${x1},${y1} C${x1},${y1+40} ${lx},${(y1+y2)/2} ${lx},${(y1+y2)/2} C${lx},${(y1+y2)/2} ${lx},${y2-40} ${x2},${y2}`;
    } else if (Math.abs(x1 - x2) < 10) {
      path = `M${x1},${y1} L${x2},${y2}`;
    } else {
      const midY = (y1 + y2) / 2;
      path = `M${x1},${y1} C${x1},${midY} ${x2},${midY} ${x2},${y2}`;
    }
    const line = edgeG.append('path')
      .attr('class', `svg-edge edge-${e.from}-${e.to}`)
      .attr('d', path)
      .attr('fill', 'none')
      .attr('stroke', isFeedback ? '#f0b429' : '#555')
      .attr('stroke-width', 1.4)
      .attr('opacity', 0.6)
      .attr('marker-end', isFeedback ? 'url(#arr-gold)' : 'url(#arr)')
      .attr('stroke-dasharray', isFeedback ? '5,3' : null);
    line.on('mouseenter', ev => {
      showTooltip(ev, `<strong>${e.from} → ${e.to}</strong><br>${e.label}`);
      line.attr('opacity', 1).attr('stroke', '#aaa').attr('stroke-width', 2);
    }).on('mouseleave', () => { hideTooltip(); line.attr('opacity', 0.6).attr('stroke', isFeedback ? '#f0b429' : '#555').attr('stroke-width', 1.4); });
  });

  // ── Process nodes
  const nodeG = root.append('g').attr('class','node-layer');
  PROCESSES.forEach(p => {
    const { x, y } = POS[p.id];
    const color = state.colorByPG ? PG_COLOR[p.group].border : KA_COLOR[p.ka];
    const g = nodeG.append('g')
      .attr('class', `svg-node node-${p.id}`)
      .attr('data-id', p.id)
      .attr('transform', `translate(${x},${y})`)
      .style('cursor', 'pointer')
      .attr('opacity', visible(p) && matchesSearch(p) ? 1 : 0.15);

    // Shadow
    g.append('rect').attr('x', -NODE_W/2+2).attr('y', -NODE_H/2+2)
      .attr('width', NODE_W).attr('height', NODE_H).attr('rx', 7)
      .attr('fill', 'rgba(0,0,0,0.35)').attr('filter', null);

    // Node rect
    g.append('rect').attr('class','node-rect')
      .attr('x', -NODE_W/2).attr('y', -NODE_H/2)
      .attr('width', NODE_W).attr('height', NODE_H).attr('rx', 7)
      .attr('fill', color).attr('stroke', 'rgba(255,255,255,0.25)').attr('stroke-width', 1);

    // ID label
    g.append('text').attr('y', -NODE_H/2 + 13)
      .text(p.id).attr('text-anchor','middle')
      .attr('fill','rgba(255,255,255,0.8)').attr('font-size', 9)
      .attr('font-weight', 700).attr('font-family','system-ui,sans-serif');

    // Name lines
    const l1 = p.line1 || '', l2 = p.line2 || '';
    g.append('text').attr('y', l2 ? -4 : 3)
      .text(l1).attr('text-anchor','middle').attr('fill','#fff')
      .attr('font-size', 10).attr('font-weight', 600).attr('font-family','system-ui,sans-serif');
    if (l2) {
      g.append('text').attr('y', 10)
        .text(l2).attr('text-anchor','middle').attr('fill','rgba(255,255,255,0.85)')
        .attr('font-size', 10).attr('font-family','system-ui,sans-serif');
    }

    // Milestone badge
    if (state.showMilestones) {
      const mOuts = p.outputs.filter(o => o.milestone);
      mOuts.forEach((o, mi) => {
        const bx = NODE_W/2 - 8 - mi*18, by = -NODE_H/2;
        const bg = g.append('g').attr('class','milestone-badge')
          .attr('transform', `translate(${bx},${by})`);
        bg.append('polygon')
          .attr('points', '0,-7 7,0 0,7 -7,0')
          .attr('fill', '#FFD700').attr('stroke','rgba(0,0,0,0.3)').attr('stroke-width',1);
        bg.append('text').attr('text-anchor','middle').attr('dominant-baseline','middle')
          .text('★').attr('font-size', 6).attr('fill','#000');
        bg.on('mouseenter', ev => showTooltip(ev, `<strong>${o.milestone}: ${getMilestone(o.milestone)?.name}</strong>`))
           .on('mouseleave', hideTooltip);
      });
    }

    // Interactions
    g.on('mouseenter', ev => {
      showTooltip(ev, `<strong>${p.id} ${p.name}</strong><span class="tip-ka">${p.ka} Management</span><br><span class="tip-pg" style="color:${PG_COLOR[p.group].label}">${p.group}</span>`);
    }).on('mouseleave', hideTooltip)
      .on('click', () => openPanel(p.id));
  });

  // Zoom button wiring
  document.getElementById('btn-fit').onclick = () => {
    svg.transition().duration(400).call(zoom.transform, d3.zoomIdentity.translate(20,10).scale(0.52));
  };
  document.getElementById('btn-zoom-in').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.4);
  document.getElementById('btn-zoom-out').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 0.7);
}

function applyFlowFilters() {
  PROCESSES.forEach(p => {
    const show = visible(p) && matchesSearch(p);
    d3.selectAll(`[data-id="${p.id}"]`).attr('opacity', show ? 1 : 0.1);
  });
  d3.selectAll('.edge-layer').attr('display', state.showEdges ? null : 'none');
}

function highlightProcess(id) {
  d3.selectAll('.svg-node').classed('highlighted', false).classed('dimmed', false);

    d3.selectAll('.svg-node').classed('dimmed', true);
    d3.select(`[data-id="${id}"]`).classed('highlighted', true).classed('dimmed', false);
  }
}

const KEY_ARTIFACTS = [
  'Project charter','Stakeholder register','Project management plan',
  'Scope management plan','Requirements documentation','Requirements traceability matrix',
  'Project scope statement','Scope baseline','Schedule management plan',
  'Activity list','Project schedule','Schedule baseline',
  'Cost estimates','Cost baseline','Quality management plan',
  'Quality metrics','Resource management plan','Team charter',
  'Communications management plan','Risk management plan','Risk register',
  'Risk report','Procurement management plan','Agreements/Contracts',
  'Stakeholder engagement plan','Lessons learned register','Change requests',
  'Issue log','Assumption log','Deliverables',
  'Work performance data','Work performance information','Work performance reports',
];

function renderMatrix() {
  const wrap = document.getElementById('matrix-wrap');
  const filterMode = wrap.dataset.filter || 'all';

  // Build lookup
  const inputSet = {}, outputSet = {};
  PROCESSES.forEach(p => {
    p.inputs.forEach(inp => {
      KEY_ARTIFACTS.forEach(a => {
        if (inp.toLowerCase().includes(a.toLowerCase().split('/')[0].toLowerCase())) {
          if (!inputSet[p.id]) inputSet[p.id] = new Set();
          inputSet[p.id].add(a);
        }
      });
    });
    p.outputs.forEach(o => {
      KEY_ARTIFACTS.forEach(a => {
        if (o.name.toLowerCase().includes(a.toLowerCase().split('/')[0].toLowerCase())) {
          if (!outputSet[p.id]) outputSet[p.id] = new Set();
          outputSet[p.id].add(a);
        }
      });
    });
  });

  let html = '<table id="matrix-table"><thead><tr><th>Process</th>';
  KEY_ARTIFACTS.forEach(a => { html += `<th title="${a}">${a}</th>`; });
  html += '</tr></thead><tbody>';

  PROCESSES.forEach(p => {
    const isVis = visible(p) && matchesSearch(p);
    html += `<tr style="opacity:${isVis?1:0.3}">`;
    html += `<td onclick="openPanel('${p.id}')" style="cursor:pointer;color:${KA_COLOR[p.ka]}" title="${p.id} ${p.name}"><span style="font-weight:700;margin-right:4px">${p.id}</span>${p.name}</td>`;
    KEY_ARTIFACTS.forEach(a => {
      const isIn  = inputSet[p.id]?.has(a);
      const isOut = outputSet[p.id]?.has(a);
      if (isIn && isOut) html += `<td class="cell-io" title="${a} is both input and output of ${p.id}">↔</td>`;
      else if (isIn)     html += `<td class="cell-i"  title="${a} is INPUT to ${p.id}">I</td>`;
      else if (isOut)    html += `<td class="cell-o"  title="${a} is OUTPUT of ${p.id}">O</td>`;
      else               html += '<td></td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

function renderTimeline() {
  const grid = document.getElementById('timeline-grid');
  grid.style.gridTemplateColumns = `120px repeat(5, 1fr)`;

  let html = '<div class="tl-header" style="background:var(--bg2);position:sticky;top:0;left:0;z-index:6"></div>';
  PG_ORDER.forEach(pg => {
    const c = PG_COLOR[pg];
    html += `<div class="tl-header" style="color:${c.label};border-color:${c.border}">${pg}</div>`;
  });

  KA_ORDER.forEach(ka => {
    const color = KA_COLOR[ka];
    html += `<div class="tl-ka-label" style="border-left:3px solid ${color}">${ka}<br><span style="font-size:9px;color:var(--text2);font-weight:400">Management</span></div>`;
    PG_ORDER.forEach(pg => {
      const procs = PROCESSES.filter(p => p.ka === ka && p.group === pg);
      const milestones = procs.flatMap(p => p.outputs.filter(o => o.milestone).map(o => ({proc:p, ms:o.milestone})));
      html += `<div class="tl-cell">`;
      procs.forEach(p => {
        const isVis = visible(p) && matchesSearch(p);
        const col = state.colorByPG ? PG_COLOR[pg].border : color;
        html += `<div class="tl-block" style="background:${col};opacity:${isVis?1:0.25}" onclick="openPanel('${p.id}')" title="${p.id} ${p.name}">
          <div class="tid">${p.id}</div>${p.line1}${p.line2?' '+p.line2:''}</div>`;
      });
      milestones.forEach(({ms}) => {
        const m = getMilestone(ms);
        if (m) html += `<div class="tl-milestone">★ ${ms}: ${m.name.replace('Approved','').replace('Created','').replace('Signed','').replace('Produced','').replace('Established','').trim()}</div>`;
      });
      html += '</div>';
    });
  });
  grid.innerHTML = html;
}

//  DETAIL PANEL
// ═══════════════════════════════════════════════════════════════════
function openPanel(id) {
  const p = getProcess(id);
  if (!p) return;
  state.selectedId = id;

  document.getElementById('panel-id').textContent = p.id;
  document.getElementById('panel-name').textContent = p.name;

  const meta = document.getElementById('panel-meta');
  const pgc = PG_COLOR[p.group];
  meta.innerHTML = `
    <span class="meta-badge" style="background:${KA_COLOR[p.ka]}20;color:${KA_COLOR[p.ka]};border:1px solid ${KA_COLOR[p.ka]}60">${p.ka}</span>
    <span class="meta-badge" style="background:${pgc.bg};color:${pgc.label};border:1px solid ${pgc.border}">${p.group}</span>`;

  const body = document.getElementById('panel-body');
  let html = `<div id="panel-purpose">${p.purpose}</div>`;

  html += `<div class="panel-section inputs">
    <div class="panel-section-title">INPUTS (${p.inputs.length}) <span class="itto-tap-hint">tap any item to learn more</span></div>
    <ul class="panel-list">${p.inputs.map(i => `<li class="itto-item" data-itto="${escAttr(i)}" data-type="input">${i}<span class="itto-hint">ⓘ</span></li>`).join('')}</ul>
  </div>`;

  html += `<div class="panel-section tools">
    <div class="panel-section-title">TOOLS &amp; TECHNIQUES (${p.tools.length}) <span class="itto-tap-hint">tap any item to learn more</span></div>
    <ul class="panel-list">${p.tools.map(t => `<li class="itto-item" data-itto="${escAttr(t)}" data-type="tool">${t}<span class="itto-hint">ⓘ</span></li>`).join('')}</ul>
  </div>`;

  const outItems = p.outputs.map(o => {
    const nm = escAttr(o.name);
    if (o.milestone) {
      const m = getMilestone(o.milestone);
      return `<li class="milestone itto-item" data-itto="${nm}" data-type="output">★ ${o.name} <span class="milestone-tag">${o.milestone}: ${m?.name}</span><span class="itto-hint">ⓘ</span></li>`;
    }
    return `<li class="itto-item" data-itto="${nm}" data-type="output">${o.name}<span class="itto-hint">ⓘ</span></li>`;
  }).join('');
  html += `<div class="panel-section outputs">
    <div class="panel-section-title">OUTPUTS (${p.outputs.length}) <span class="itto-tap-hint">tap any item to learn more</span></div>
    <ul class="panel-list">${outItems}</ul>
  </div>`;

  body.innerHTML = html;

  const panel = document.getElementById('detail-panel');
  panel.classList.remove('closed');
  panel.scrollTop = 0;

  // Highlight in flowchart
  if (state.view === 'flow') highlightProcess(id);
  if (state.view === 'flow' && state.zoom) scrollToNode(id);
}

function scrollToNode(id) {
  const pos = POS[id];
  if (!pos || typeof d3 === 'undefined') return;
  const svg = state.zoomSvg;
  const zoom = state.zoom;
  if (!svg || !zoom) return;
  const wrap = document.getElementById('flow-svg-wrap');
  const cw = wrap.clientWidth, ch = wrap.clientHeight;
  const scale = 1.1;
  const tx = cw/2 - pos.x * scale;
  const ty = ch/2 - pos.y * scale;
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

function closePanel() {
  document.getElementById('detail-panel').classList.add('closed');
  state.selectedId = null;
  if (state.view === 'flow') highlightProcess(null);
}

document.getElementById('panel-close').addEventListener('click', closePanel);

document.getElementById('btn-prev').addEventListener('click', () => {
  const idx = PROCESSES.findIndex(p => p.id === state.selectedId);
  if (idx > 0) openPanel(PROCESSES[idx - 1].id);
});
document.getElementById('btn-next').addEventListener('click', () => {
  const idx = PROCESSES.findIndex(p => p.id === state.selectedId);
  if (idx < PROCESSES.length - 1) openPanel(PROCESSES[idx + 1].id);
});

// Keyboard nav
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePanel();
  if (document.getElementById('detail-panel').classList.contains('closed')) return;
  if (e.key === 'ArrowRight') document.getElementById('btn-next').click();
  if (e.key === 'ArrowLeft')  document.getElementById('btn-prev').click();
});

'Organizational process assets':{icon:'🏛️',what:'Plans, processes, policies, templates, and knowledge bases from the performing organization the project can use.',example:'A project schedule template, a lessons-learned repository from past projects, or a company-standard risk matrix.',tip:'Organizational memory — using OPAs avoids reinventing the wheel and ensures standards are followed.'},

'Work performance data':{icon:'📊',what:'Raw measurements and observations collected during project execution — the rawest form of project status.',example:'Percentage of activities completed, number of defects found, cost incurred to date, actual duration of tasks.',tip:'Always an output of Direct and Manage Project Work (4.3) and flows into monitoring processes as an input.'},

'Benchmarking':{icon:'📊',what:'Comparing actual or planned practices to comparable organizations to identify best practices and set targets.',example:'Comparing your release cycle time (3 weeks) to industry benchmark (1 week) to set improvement targets.',tip:'Can be internal (compare to other projects) or external (compare to industry standards).'},

function getIttoExplain(text) {
  if (!text) return null;
  // 1. Exact match
  if (ITTO_EXPLAIN[text]) return ITTO_EXPLAIN[text];
  // 2. Strip parenthetical → exact match on base name
  const base = text.replace(/\s*\([^)]*\)\s*/g,'').trim();
  if (ITTO_EXPLAIN[base]) return ITTO_EXPLAIN[base];
  // 3. Case-insensitive starts-with (longest match wins)
  let bestKey = null, bestLen = 0;
  const tl = text.toLowerCase();
  for (const k of Object.keys(ITTO_EXPLAIN)) {
    if (tl.startsWith(k.toLowerCase()) && k.length > bestLen) { bestKey = k; bestLen = k.length; }
  }
  if (bestKey) return ITTO_EXPLAIN[bestKey];
  // 4. Partial contains match
  for (const k of Object.keys(ITTO_EXPLAIN)) {
    if (tl.includes(k.toLowerCase())) return ITTO_EXPLAIN[k];
  }
  return null;
}

function findToolByName(text) {
  if (!text) return null;
  const tl = text.toLowerCase().replace(/\s*\([^)]*\)\s*/g,'').trim();
  let t = TOOLS.find(x => x.name.toLowerCase() === tl);
  if (t) return t;
  t = TOOLS.find(x => tl.startsWith(x.name.toLowerCase()) || x.name.toLowerCase().startsWith(tl));
  if (t) return t;
  t = TOOLS.find(x => tl.includes(x.name.toLowerCase()) || x.name.toLowerCase().includes(tl));
  return t || null;
}

function openToolModal(tool) {
  const c = TOOL_CAT_COLOR[tool.category] || '#8b949e';
  const label = CAT_LABEL[tool.category] || tool.category;
  document.getElementById('tmo-cat').innerHTML =
    `<span style="color:${c};background:${c}22;border:1px solid ${c}44;padding:2px 8px;border-radius:10px">${label}</span>`;
  document.getElementById('tmo-name').textContent = tool.name;
  document.getElementById('tmo-tagline').textContent = tool.tagline;
  const svg = typeof tool.visual === 'function' ? tool.visual() : (tool.visual || '');
  document.getElementById('tmo-visual').innerHTML = svg;
  document.getElementById('tmo-desc').innerHTML = `<strong>What it is:</strong> ${tool.desc}`;
  document.getElementById('tmo-when').innerHTML = `<strong>When to use:</strong> ${tool.when}`;
  document.getElementById('tmo-tip').innerHTML = `💡 <strong>Exam tip:</strong> ${tool.tip}`;
  const usedIn = (tool.usedIn || []).map(id => {
    const p = PROCESSES.find(x => x.id === id);
    return `<span class="tool-modal-pid" title="${p ? p.name : id}">${id}${p ? ' — ' + p.name : ''}</span>`;
  }).join('');
  document.getElementById('tmo-usedin').innerHTML = usedIn
    ? `<span style="font-size:11px;color:var(--text2);font-weight:600">Used in:</span>${usedIn}` : '';
  document.getElementById('tool-modal-overlay').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeToolModal() {
  document.getElementById('tool-modal-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

(function initToolModal() {
  document.getElementById('tool-modal-close').addEventListener('click', closeToolModal);
  document.getElementById('tool-modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'tool-modal-overlay') closeToolModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeToolModal(); });
})();

function ittoClick(el) {
  const text = el.dataset.itto;
  const type = el.dataset.type || 'input';
  // Toggle: close if already open
  const next = el.nextElementSibling;
  if (next && next.classList.contains('itto-card')) { next.remove(); return; }
  // Close any other open card in the same list
  el.closest('ul')?.querySelectorAll('.itto-card').forEach(c => c.remove());
  const info = getIttoExplain(text);
  const matchedTool = type === 'tool' ? findToolByName(text) : null;
  const card = document.createElement('div');
  card.className = `itto-card type-${type}`;
  let inner = '';
  if (info) {
    inner = `<div class="itto-card-inner"><span class="itto-card-icon">${info.icon}</span><div><div class="itto-card-what">${info.what}</div>${info.example?`<div class="itto-card-example"><em>Example:</em> ${info.example}</div>`:''} ${info.tip?`<div class="itto-card-tip">💡 ${info.tip}</div>`:''}</div></div>`;
  } else {
    inner = `<div class="itto-card-inner"><span class="itto-card-icon">📄</span><div class="itto-card-what" style="color:var(--text2)">No additional detail available for <em style="color:var(--text)">"${text}"</em>.</div></div>`;
  }
  if (matchedTool) {
    inner += `<button class="itto-card-tool-btn" data-toolid="${matchedTool.id}">🃏 See full tool card →</button>`;
  }
  card.innerHTML = inner;
  el.after(card);
  card.scrollIntoView({block:'nearest',behavior:'smooth'});
}

// Event delegation for ITTO clicks + tool modal button
document.addEventListener('click', e => {
  // "See full tool card" button inside an itto-card
  const btn = e.target.closest('.itto-card-tool-btn');
  if (btn) {
    e.stopPropagation();
    const tool = TOOLS.find(t => t.id === btn.dataset.toolid);
    if (tool) openToolModal(tool);
    return;
  }
  // Normal ITTO item click
  const li = e.target.closest('.itto-item');
  if (li) { e.stopPropagation(); ittoClick(li); }
});

{id:'root-cause',name:'Root Cause Analysis',tagline:'Find the cause, not just the symptom',
category:'data-analysis',
usedIn:['8.2','8.3','4.5'],
desc:'A structured technique to identify the underlying fundamental cause of a defect or problem, not just treat its symptoms. The 5 Whys method iteratively asks "why?" until the root cause is found.',
when:'Quality management (QA audits, QC), integrated change control, or any time a recurring problem needs a permanent fix.',
tip:'A problem is rarely caused by a single root cause — use the fishbone diagram alongside 5 Whys to explore multiple causal branches.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="130" y="14" text-anchor="middle" font-size="10" fill="#f85149" font-weight="700">5 WHYS METHOD</text>
${[['Tests failing?','Symptom','#f85149'],['Wrong API spec?','Why 1','#f0b429'],['Spec not reviewed?','Why 2','#f0b429'],['No review process?','Why 3','#58a6ff'],['✓ Root Cause','Why 4','#3fb950']].map(([text,why,c],i)=>`
<rect x="20" y="${22+i*17}" width="170" height="14" rx="3" fill="${c}22" stroke="${c}" stroke-width="${i===4?2:1}"/>
<text x="28" y="${32+i*17}" font-size="8.5" fill="${c}">${text}</text>
<text x="197" y="${32+i*17}" font-size="8" fill="${c}88">${why}</text>
${i<4?`<text x="105" y="${42+i*17}" text-anchor="middle" font-size="9" fill="${c}66">↓ Why?</text>`:''}
`).join('')}
</svg>`},

{id:'variance-analysis',name:'Variance Analysis',tagline:'Compare planned vs. actual — find the cause',
category:'data-analysis',
usedIn:['4.5','6.6','7.4','8.3'],
desc:'Comparing planned project performance against actual results to determine the degree of difference and identify its cause. Answers: How big is the variance? Why did it occur? Will it continue?',
when:'Monitor & Control Project Work, Control Schedule, Control Costs — any time you need to understand why actuals differ from the plan.',
tip:'A variance in isolation is less useful than the trend — a small but growing variance is more worrying than a large stable one.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="130" y="14" text-anchor="middle" font-size="10" fill="#58a6ff" font-weight="700">SCHEDULE VARIANCE</text>
${[['Planned','$500K','#58a6ff'],['Actual','$420K','#3fb950'],['Variance','−$80K (−16%)','#f0b429']].map(([l,v,c],i)=>`
<rect x="20" y="${22+i*22}" width="220" height="18" rx="4" fill="${c}18" stroke="${c}" stroke-width="1.2"/>
<text x="30" y="${34+i*22}" font-size="9" fill="#8b949e">${l}</text>
<text x="230" y="${34+i*22}" text-anchor="end" font-size="10" fill="${c}" font-weight="700">${v}</text>
`).join('')}
<rect x="20" y="92" width="220" height="18" rx="4" fill="#21262d" stroke="#30363d"/>
<text x="30" y="104" font-size="8.5" fill="#8b949e">Cause: Testing underestimated by 40%</text>
<text x="230" y="104" text-anchor="end" font-size="8.5" fill="#f85149">→ Action required</text>
</svg>`},

usedIn:['4.5','6.6','7.4'],

when:'Monitor & Control — any time you need to forecast whether current performance will lead to an acceptable final result.',
tip:'A declining CPI (e.g. 1.05 → 0.98 → 0.91) is more alarming than a stable CPI of 0.88 — direction matters as much as magnitude.',

<text x="130" y="14" text-anchor="middle" font-size="9" fill="#f85149">⚠ CPI declining — corrective action needed</text>

{id:'sensitivity-analysis',name:'Sensitivity Analysis',tagline:'Identify which variable drives the most risk impact',
category:'data-analysis',
usedIn:['11.4'],
desc:'Determines which individual project risks or other sources of uncertainty have the most potential impact on project objectives. Results are typically displayed as a Tornado Diagram — the widest bar drives the most variance.',

tip:'Sensitivity analysis answers "where should I focus?" — it doesn\'t tell you what to do about risks, but tells you which ones deserve most of your attention.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">

<text x="130" y="115" text-anchor="middle" font-size="7" fill="#8b949e">Base NPV: $200K</text>
${[['Regulatory delay',45,85,'#f85149'],['Key resource loss',60,80,'#f0b429'],['Market demand',70,78,'#f0b429'],['Tech complexity',85,76,'#58a6ff'],['Vendor risk',97,74,'#8b949e']].map(([label,low,high,c],i)=>`

</svg>`},

{id:'monte-carlo',name:'Monte Carlo Simulation',tagline:'Model thousands of scenarios to reveal outcome ranges',

{id:'assumption-constraint-analysis',name:'Assumption & Constraint Analysis',tagline:'Surface hidden risks baked into the plan',
category:'data-analysis',
usedIn:['11.2'],
desc:'Examines the validity of assumptions made during project planning and identifies potential risks from invalid assumptions. Also analyses constraints (budget, schedule, resources, technology) to determine associated risk.',
when:'Identify Risks — specifically when reviewing the project management plan and project documents to find risks embedded in assumptions.',
tip:'Every assumption is a potential risk. If an assumption turns out to be false, what happens? Document the assumption, the risk if wrong, and the trigger to re-evaluate.',

<text x="14" y="28" font-size="8" fill="#8b949e">Assumption</text>

<text x="225" y="28" font-size="8" fill="#8b949e">Risk?</text>
${[['Vendor delivers on time','3-wk delay = $30K','HIGH','#f85149'],['Requirements are stable','Change requests flood in','MED','#f0b429'],['Team has React expertise','Training needed (+2wk)','LOW','#3fb950'],['Budget approved next month','Project paused','HIGH','#f85149']].map(([a,w,r,c],i)=>`
<rect x="10" y="${33+i*18}" width="240" height="16" rx="2" fill="${i%2?'#161b22':'#1a1f26'}"/>
<text x="14" y="${44+i*18}" font-size="7.5" fill="#c9d1d9">${a}</text>
<text x="148" y="${44+i*18}" font-size="7.5" fill="${c}88">${w}</text>
<rect x="213" y="${34+i*18}" width="30" height="12" rx="3" fill="${c}33" stroke="${c}" stroke-width="1"/>
<text x="228" y="${43+i*18}" text-anchor="middle" font-size="7.5" fill="${c}" font-weight="700">${r}</text>
`).join('')}
</svg>`},

// ─── DATA REPRESENTATION ─────────────────────────────────────────────
{id:'affinity-diagram',name:'Affinity Diagram',tagline:'Group large numbers of ideas into natural clusters',
category:'data-representation',
usedIn:['5.2','5.3'],
desc:'A technique for organising a large number of ideas, opinions, or data by grouping them based on natural affinity or relationship. Typically uses sticky notes arranged on a wall into clusters.',
when:'Collect Requirements, Define Scope — after brainstorming to organise many ideas into manageable categories.',
tip:'After brainstorming 60 risks or requirements, an affinity diagram reveals patterns and gaps that a flat list conceals.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
${[['Technical',10,12,'#58a6ff',['API design','DB schema','Security','Load test']],['Process',100,12,'#3fb950',['Approvals','Sign-offs','Reviews']],['Business',175,12,'#f0b429',['ROI','Budget','Contracts','Stakeholders']]].map(([group,x,y,c,items])=>`
<text x="${x+30}" y="${y+9}" font-size="9" fill="${c}" font-weight="700">${group}</text>
${items.map((item,i)=>`
<rect x="${x+(i%2)*38}" y="${y+14+Math.floor(i/2)*24}" width="34" height="18" rx="3" fill="${c}33" stroke="${c}" stroke-width="0.8" transform="rotate(${(Math.random()*4-2).toFixed(1)},${x+(i%2)*38+17},${y+14+Math.floor(i/2)*24+9})"/>
<text x="${x+(i%2)*38+17}" y="${y+26+Math.floor(i/2)*24}" text-anchor="middle" font-size="7.5" fill="${c}">${item}</text>
`).join('')}
`).join('')}
</svg>`},

{id:'fishbone',name:'Cause-and-Effect (Fishbone) Diagram',tagline:'Structured root cause visualisation by category',
category:'data-representation',
usedIn:['8.2','8.3'],
desc:'Also called an Ishikawa diagram. A visual tool that maps potential causes of a problem organised into categories (Method, Machine, Material, Man, Environment, Measurement). The problem is the "head" of the fish.',
when:'Manage Quality, Control Quality — during QA audits and QC investigations to identify root causes of defects.',
tip:'The 6 Ms (Man, Machine, Method, Material, Measurement, Mother Nature/Environment) are a standard starting framework for the branches.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<line x1="20" y1="58" x2="210" y2="58" stroke="#f85149" stroke-width="2"/>
<polygon points="210,52 228,58 210,64" fill="#f85149"/>
<rect x="230" y="44" width="26" height="28" rx="4" fill="#f8514933" stroke="#f85149" stroke-width="1.5"/>
<text x="243" y="60" text-anchor="middle" font-size="7" fill="#f85149" font-weight="700">DEFECT</text>
${[['Method',50,20,'#58a6ff',true],['Machine',130,20,'#f0b429',true],['Material',50,95,'#3fb950',false],['Man',130,95,'#bc8cff',false]].map(([label,x,y,c,above])=>`
<line x1="${x}" y1="${y}" x2="${above?x-5:x-5}" y2="58" stroke="${c}" stroke-width="1.5"/>
<text x="${x}" y="${above?y-5:y+12}" text-anchor="middle" font-size="9" fill="${c}" font-weight="700">${label}</text>
<line x1="${x-25}" y1="${above?y+15:y-15}" x2="${x}" y2="${above?y+5:y-5}" stroke="${c}" stroke-width="0.8" opacity="0.7"/>
<line x1="${x+5}" y1="${above?y+15:y-15}" x2="${x+10}" y2="${above?y+5:y-5}" stroke="${c}" stroke-width="0.8" opacity="0.7"/>
`).join('')}
</svg>`},

{id:'control-chart',name:'Control Chart',tagline:'Detect non-random variation — 7-point rule',
category:'data-representation',
usedIn:['8.3'],
desc:'A type of run chart with statistically calculated Upper and Lower Control Limits (UCL/LCL) that represents the expected variation of a stable process. Points outside control limits or patterns within them indicate non-random causes.',
when:'Control Quality — monitoring any measurable process output over time to detect when the process is going out of control.',
tip:'"Rule of Seven": 7 consecutive points on one side of the mean indicates a non-random shift — investigate even if no point is outside the control limits.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<line x1="30" y1="10" x2="30" y2="100" stroke="#30363d" stroke-width="1.5"/>
<line x1="30" y1="100" x2="245" y2="100" stroke="#30363d" stroke-width="1.5"/>
<line x1="30" y1="25" x2="245" y2="25" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="247" y="28" font-size="8" fill="#f85149">UCL</text>
<line x1="30" y1="55" x2="245" y2="55" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="247" y="58" font-size="8" fill="#3fb950">Mean</text>
<line x1="30" y1="85" x2="245" y2="85" stroke="#f85149" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="247" y="88" font-size="8" fill="#f85149">LCL</text>
<polyline points="50,60 75,50 100,65 125,48 150,70 175,58 200,30 215,40" fill="none" stroke="#58a6ff" stroke-width="1.8"/>
${[[50,60],[75,50],[100,65],[125,48],[150,70],[175,58],[200,30],[215,40]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3" fill="${y<=25||y>=85?'#f85149':'#58a6ff'}"/>`).join('')}
<circle cx="200" cy="30" r="5" fill="none" stroke="#f85149" stroke-width="2"/>
<text x="200" y="20" text-anchor="middle" font-size="8" fill="#f85149">⚠ OOC</text>
</svg>`},

{id:'flowchart',name:'Flowchart / Process Map',tagline:'Visualise decision logic and process flow',
category:'data-representation',
usedIn:['8.1','8.2','11.2'],
desc:'A visual representation of a process using standardised shapes to depict steps, decision points, and flow directions. Helps teams understand how a process works and where failure points exist.',
when:'Plan Quality Management, Manage Quality — mapping processes to identify potential quality risks and process improvements.',
tip:'Swimlane flowcharts (one lane per role) are especially powerful for identifying handoff failures between teams.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<rect x="95" y="5" width="70" height="20" rx="10" fill="#58a6ff33" stroke="#58a6ff" stroke-width="1.5"/>
<text x="130" y="19" text-anchor="middle" font-size="8.5" fill="#58a6ff">START</text>

<text x="130" y="46" text-anchor="middle" font-size="7.5" fill="#f0b429">Approved?</text>
<line x1="145" y1="42" x2="185" y2="42" stroke="#f85149" stroke-width="1.2"/>

<rect x="185" y="32" width="55" height="20" rx="3" fill="#f8514922" stroke="#f85149" stroke-width="1"/>

<text x="144" y="56" font-size="7" fill="#3fb950">Yes</text>
<line x1="130" y1="50" x2="130" y2="62" stroke="#3fb950" stroke-width="1.2"/>
<rect x="92" y="62" width="76" height="20" rx="3" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5"/>
<text x="130" y="75" text-anchor="middle" font-size="8" fill="#3fb950">Implement</text>
<line x1="130" y1="82" x2="130" y2="92" stroke="#8b949e" stroke-width="1.2"/>
<rect x="95" y="92" width="70" height="20" rx="10" fill="#bc8cff33" stroke="#bc8cff" stroke-width="1.5"/>
<text x="130" y="106" text-anchor="middle" font-size="8.5" fill="#bc8cff">END</text>
</svg>`},

{id:'histogram',name:'Histogram',tagline:'Frequency distribution of a measured variable',
category:'data-representation',

<line x1="30" y1="95" x2="240" y2="95" stroke="#30363d" stroke-width="1.5"/>
<text x="130" y="108" text-anchor="middle" font-size="8" fill="#8b949e">Defects per Module</text>
<text x="18" y="55" font-size="8" fill="#8b949e" writing-mode="vertical-rl">Frequency</text>
${[[30,3,'#58a6ff'],[52,8,'#58a6ff'],[74,22,'#58a6ff'],[96,42,'#3fb950'],[118,55,'#3fb950'],[140,38,'#3fb950'],[162,20,'#f0b429'],[184,10,'#f0b429'],[206,4,'#f85149']].map(([x,h,c])=>`<rect x="${x}" y="${95-h*1.5}" width="20" height="${h*1.5}" fill="${c}77" stroke="${c}" stroke-width="1"/>`).join('')}

</svg>`},

{id:'probability-impact',name:'Probability & Impact Matrix',tagline:'Risk heat map — classify by probability × impact',
category:'data-representation',
usedIn:['11.3'],
desc:'A grid that maps each identified risk against its probability of occurrence and its potential impact on project objectives. Colour-coded zones (green/yellow/red) guide prioritisation of risk responses.',
when:'Perform Qualitative Risk Analysis — to prioritise individual risks for further analysis or response planning.',
tip:'Define the probability and impact scales before the matrix — agreement on what "High" means prevents endless debate when assessing risks.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="130" y="12" text-anchor="middle" font-size="9" fill="#8b949e">Impact →</text>
<text x="10" y="68" font-size="9" fill="#8b949e" writing-mode="vertical-rl">Probability</text>
${[0,1,2,3,4].map(row=>[0,1,2,3,4].map(col=>{
  const score=(row+1)*(col+1);
  const c=score<=4?'#3fb950':score<=9?'#f0b429':'#f85149';
  return `<rect x="${30+col*44}" y="${18+row*18}" width="42" height="16" fill="${c}${score<=4?'44':score<=9?'55':'66'}" stroke="${c}" stroke-width="0.5"/><text x="${51+col*44}" y="${29+row*18}" text-anchor="middle" font-size="8" fill="${c}" font-weight="600">${score<=4?'L':score<=9?'M':'H'}</text>`;
}).join('')).join('')}
${['VL','L','M','H','VH'].map((l,i)=>`<text x="${51+i*44}" y="108" text-anchor="middle" font-size="8" fill="#8b949e">${l}</text><text x="22" y="${26+i*18}" text-anchor="middle" font-size="8" fill="#8b949e">${['VH','H','M','L','VL'][i]}</text>`).join('')}
${[['R1',96,18+0*18+8,'#f85149'],['R2',30+2*44+21,18+2*18+8,'#f0b429'],['R3',30+0*44+21,18+4*18+8,'#3fb950']].map(([l,x,y,c])=>`<circle cx="${x}" cy="${y}" r="6" fill="${c}" opacity="0.9"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="7" fill="#fff" font-weight="700">${l}</text>`).join('')}
</svg>`},

{id:'scatter-diagram',name:'Scatter Diagram',tagline:'Reveal correlation between two variables',
category:'data-representation',
usedIn:['8.3'],
desc:'A chart that plots the relationship between two variables to determine if they are correlated. The pattern of data points — linear, curved, or random — indicates the type and strength of the relationship.',
when:'Control Quality — investigating whether a suspected cause actually correlates with a defect or quality outcome.',
tip:'Correlation ≠ causation. A strong positive correlation is evidence worth investigating, but always seek domain expertise to confirm causation.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<line x1="30" y1="10" x2="30" y2="95" stroke="#30363d" stroke-width="1.5"/>
<line x1="30" y1="95" x2="245" y2="95" stroke="#30363d" stroke-width="1.5"/>
<text x="130" y="108" text-anchor="middle" font-size="8" fill="#8b949e">Code Complexity →</text>
<text x="18" y="55" font-size="8" fill="#8b949e" writing-mode="vertical-rl">Bug Count</text>
${[[45,82],[60,75],[70,68],[80,65],[100,58],[115,50],[130,44],[145,38],[160,35],[180,28],[200,22],[215,18]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#58a6ff88" stroke="#58a6ff" stroke-width="0.8"/>`).join('')}
<line x1="40" y1="86" x2="220" y2="16" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="222" y="16" font-size="8" fill="#f0b429">r≈0.97</text>
<text x="130" y="14" text-anchor="middle" font-size="9" fill="#3fb950">Strong positive correlation ↗</text>
</svg>`},

{id:'mind-map',name:'Mind Map',tagline:'Radial idea network from a central concept',
category:'data-representation',
usedIn:['5.2','5.3','11.2'],
desc:'A visual thinking tool that starts with a central topic and radiates outward through branches representing related ideas, sub-topics, and connections. Encourages non-linear, creative thinking.',
when:'Collect Requirements, Define Scope, Identify Risks — any situation where you want to explore a topic holistically rather than linearly.',
tip:'Mind maps are especially effective for scope definition — they surface related areas that a simple list would miss.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">

<text x="130" y="55" text-anchor="middle" font-size="8" fill="#58a6ff" font-weight="700">PROJECT</text>
<text x="130" y="65" text-anchor="middle" font-size="8" fill="#58a6ff">SCOPE</text>
${[['Features',40,18,'#3fb950',['Login','Dashboard','Reports']],['Tech',210,18,'#f0b429',['React','API','DB']],['Team',30,85,'#bc8cff',['Dev','QA','PM']],['Timeline',210,85,'#f85149',['Q1','Q2','Q3']]].map(([topic,tx,ty,c,sub])=>`
<line x1="${tx>130?tx-25:tx+25}" y1="${ty>58?ty-10:ty+10}" x2="${130+(tx<130?-18:18)}" y2="${58+(ty<58?-14:14)}" stroke="${c}" stroke-width="1.5"/>
<ellipse cx="${tx}" cy="${ty}" rx="28" ry="12" fill="${c}22" stroke="${c}" stroke-width="1.2"/>
<text x="${tx}" y="${ty+4}" text-anchor="middle" font-size="8.5" fill="${c}" font-weight="600">${topic}</text>
${sub.map((s,i)=>`
<line x1="${tx+(tx<130?-28:28)}" y1="${ty}" x2="${tx+(tx<130?-52:52)}" y2="${ty-10+i*10}" stroke="${c}" stroke-width="0.8" opacity="0.7"/>
<text x="${tx+(tx<130?-55:55)}" y="${ty-7+i*10}" ${tx<130?'text-anchor="end"':''} font-size="7.5" fill="${c}88">${s}</text>
`).join('')}
`).join('')}
</svg>`},

{id:'raci',name:'RACI Matrix',tagline:'Responsibility Assignment — R/A/C/I per task',
category:'data-representation',
usedIn:['9.1'],
desc:'A Responsibility Assignment Matrix that defines roles for each task as Responsible (does the work), Accountable (owns the outcome), Consulted (input sought), or Informed (notified of decisions). Maps tasks against roles.',
when:'Plan Resource Management — establishing clear ownership and communication expectations for every work package.',
tip:'Every task must have exactly ONE Accountable person. If two people are both accountable, effectively nobody is.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">

<text x="165" y="20" text-anchor="middle" font-size="8" fill="#3fb950">Dev Lead</text>
<text x="200" y="20" text-anchor="middle" font-size="8" fill="#f0b429">QA</text>
<text x="235" y="20" text-anchor="middle" font-size="8" fill="#bc8cff">Sponsor</text>
${[['Design DB',['C','R','I','A']],['Code API',['A','R','C','I']],['Test module',['A','I','R','I']],['Deploy',['R','C','C','A']]].map(([task,roles],i)=>{
  const cols=[130,165,200,235];

${roles.map((r,j)=>`<rect x="${cols[j]-10}" y="${28+i*19}" width="20" height="13" rx="3" fill="${colours[r]}33" stroke="${colours[r]}" stroke-width="0.8"/><text x="${cols[j]}" y="${38+i*19}" text-anchor="middle" font-size="8" fill="${colours[r]}" font-weight="700">${r}</text>`).join('')}`;
}).join('')}
<text x="10" y="108" font-size="8" fill="#3fb950">R=Responsible</text>
<text x="80" y="108" font-size="8" fill="#f0b429">A=Accountable</text>
<text x="155" y="108" font-size="8" fill="#58a6ff">C=Consulted</text>

{id:'stakeholder-engagement-matrix',name:'Stakeholder Engagement Assessment Matrix',tagline:'Map current vs. desired engagement level',
category:'data-representation',
usedIn:['13.2'],
desc:'Maps each stakeholder\'s current engagement level against their desired engagement level, using five categories: Unaware, Resistant, Neutral, Supportive, Leading. Gaps identify where engagement strategy is needed.',
when:'Plan Stakeholder Engagement — to identify which stakeholders need to be moved from their current to desired engagement state.',
tip:'"C" marks current state, "D" marks desired — when C and D align, no action is needed. When they differ, a tailored engagement strategy is required.',
visual:()=>{
  const rows=[['Sponsor',[false,false,false,'C→D',false]],['CFO',[false,false,'C',false,'D']],['End Users',[false,'C',false,'D',false]],['Vendor',[false,false,'CD',false,false]]];
  function cellHtml(v,j,i){
    if(!v) return '';
    const isArrow=v.includes('→'), isCD=(v==='CD');
    const fill=isArrow?'#58a6ff22':isCD?'#3fb95022':'#f0b42922';
    const stroke=isArrow?'#58a6ff':isCD?'#3fb950':'#f0b429';
    const cx=67+j*38, cy=36+i*19;
    return '<rect x="'+(50+j*38)+'" y="'+(26+i*19)+'" width="34" height="13" rx="3" fill="'+fill+'" stroke="'+stroke+'" stroke-width="1"/>'
      +'<text x="'+cx+'" y="'+cy+'" text-anchor="middle" font-size="8" fill="'+stroke+'" font-weight="700">'+v+'</text>';
  }
  return `<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<rect x="10" y="8" width="240" height="14" rx="3" fill="#21262d"/>
<text x="14" y="19" font-size="8" fill="#8b949e" font-weight="600">Stakeholder</text>
${['Unaware','Resistant','Neutral','Supportive','Leading'].map((l,i)=>`<text x="${68+i*38}" y="19" text-anchor="middle" font-size="7.5" fill="#8b949e" font-weight="600">${l}</text>`).join('')}
${rows.map(([name,cells],i)=>`<rect x="10" y="${24+i*19}" width="240" height="17" rx="2" fill="${i%2?'#161b22':'#1a1f26'}"/>
<text x="14" y="${36+i*19}" font-size="8.5" fill="#c9d1d9">${name}</text>
${cells.map((v,j)=>cellHtml(v,j,i)).join('')}`).join('\n')}
</svg>`;
}},

<rect x="130" y="${y}" width="55" height="18" rx="3" fill="#3fb95022" stroke="#3fb950" stroke-width="1.2"/>

<line x1="67" y1="${y+9}" x2="130" y2="${y+9}" stroke="#f0b429" stroke-width="1.5" marker-end="url(#pdm-arr)"/>
<text x="98" y="${y+7}" text-anchor="middle" font-size="7.5" fill="#f0b429" font-weight="700">${type}</text>
<text x="193" y="${y+12}" font-size="7.5" fill="#8b949e">${label}</text>
`).join('')}
<defs><marker id="pdm-arr" markerWidth="5" markerHeight="4" refX="4" refY="2" orient="auto"><polygon points="0 0,5 2,0 4" fill="#f0b429"/></marker></defs>
</svg>`},

{id:'rolling-wave',name:'Rolling Wave Planning',tagline:'Plan near-term in detail, far-term at high level',
category:'scheduling',
usedIn:['6.2'],
desc:'A progressive elaboration planning technique where near-term work is planned in detail while future work remains at a higher level of the WBS. Detail is added as more information becomes available.',
when:'Define Activities — on any project where requirements or the approach are not fully known upfront, especially agile or iterative projects.',
tip:'This is not poor planning — it\'s acknowledging that detailed plans for work 6 months away will be wrong. Plan the horizon you can see clearly.',

<text x="50" y="53" text-anchor="middle" font-size="8" fill="#3fb950">Detailed WPs</text>
${['Task 1.1','Task 1.2','Task 1.3','Task 1.4'].map((t,i)=>`<text x="50" y="${64+i*10}" text-anchor="middle" font-size="7.5" fill="#3fb95099">${t}</text>`).join('')}
<rect x="100" y="30" width="70" height="62" rx="5" fill="#f0b42922" stroke="#f0b429" stroke-width="1.5"/>

<text x="135" y="61" text-anchor="middle" font-size="8" fill="#f0b429">Work packages</text>
