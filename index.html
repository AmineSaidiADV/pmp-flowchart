<text x="215" y="83" text-anchor="middle" font-size="7.5" fill="#8b949e88">Phase 3 TBD</text>
</svg>`},

{id:'leads-lags',name:'Leads & Lags',tagline:'Accelerate or delay between dependent activities',
category:'scheduling',
usedIn:['6.3','6.5'],
desc:'A Lead is a modification that accelerates a successor activity — it allows the successor to start before the predecessor finishes (negative lag). A Lag is a deliberate wait time inserted between activities (positive delay).',
when:'Sequence Activities, Develop Schedule — when activities have complex temporal relationships that simple FS/SS dependencies cannot express.',
tip:'Lead = negative lag. A lead of 2 days on a FS relationship means the successor can start 2 days BEFORE the predecessor finishes. Overuse of leads creates fragile, unplanned fast-tracking.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="65" y="12" text-anchor="middle" font-size="9" fill="#3fb950" font-weight="700">LEAD</text>
<text x="195" y="12" text-anchor="middle" font-size="9" fill="#f85149" font-weight="700">LAG</text>
<line x1="130" y1="6" x2="130" y2="112" stroke="#30363d" stroke-width="1" stroke-dasharray="4,3"/>
<rect x="5" y="20" width="60" height="18" rx="3" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5"/>
<text x="35" y="32" text-anchor="middle" font-size="8.5" fill="#3fb950">Predecessor</text>
<rect x="45" y="44" width="60" height="18" rx="3" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5"/>
<text x="75" y="56" text-anchor="middle" font-size="8.5" fill="#3fb950">Successor</text>
<text x="65" y="72" text-anchor="middle" font-size="8" fill="#3fb950">Lead = −2d</text>
<text x="65" y="83" text-anchor="middle" font-size="7.5" fill="#8b949e">Overlap allowed</text>
<text x="65" y="94" text-anchor="middle" font-size="7.5" fill="#3fb950">Schedule ↓</text>
<rect x="135" y="20" width="60" height="18" rx="3" fill="#f8514922" stroke="#f85149" stroke-width="1.5"/>
<text x="165" y="32" text-anchor="middle" font-size="8.5" fill="#f85149">Predecessor</text>
<rect x="175" y="56" width="60" height="18" rx="3" fill="#f8514922" stroke="#f85149" stroke-width="1.5"/>
<text x="205" y="68" text-anchor="middle" font-size="8.5" fill="#f85149">Successor</text>
<text x="195" y="84" text-anchor="middle" font-size="8" fill="#f85149">Lag = +3d</text>
<text x="195" y="95" text-anchor="middle" font-size="7.5" fill="#8b949e">Cure time / review</text>
<rect x="147" y="42" width="36" height="10" rx="2" fill="#f0b42933" stroke="#f0b429" stroke-width="1"/>
<text x="165" y="50" text-anchor="middle" font-size="7.5" fill="#f0b429">wait 3d</text>
</svg>`},


// ─── ESTIMATING ──────────────────────────────────────────────────────
{id:'analogous-estimating',name:'Analogous Estimating',tagline:'Use a similar past project as a reference point',
category:'estimating',
usedIn:['6.4','7.2'],
desc:'A technique that uses historical data from a similar past project as the basis for estimating the current project. Fast and low-cost, but less accurate — relies on the similarity of the projects and the estimator\'s expertise.',
when:'Early in planning when limited details are available and a rough order of magnitude (ROM) estimate is acceptable.',
tip:'Analogous = top-down. It\'s the quickest but least accurate. ROM accuracy is typically −25% to +75%. Requires expert judgment to validate the comparison.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<rect x="10" y="18" width="100" height="72" rx="6" fill="#8b949e22" stroke="#8b949e" stroke-width="1.5"/>
<text x="60" y="38" text-anchor="middle" font-size="9" fill="#8b949e" font-weight="700">PAST PROJECT</text>
<text x="60" y="53" text-anchor="middle" font-size="8" fill="#8b949e">Duration: 8 months</text>
<text x="60" y="67" text-anchor="middle" font-size="8" fill="#8b949e">Cost: $400K</text>
<text x="60" y="81" text-anchor="middle" font-size="8" fill="#8b949e">Team: 6 people</text>
<text x="130" y="58" text-anchor="middle" font-size="20" fill="#f85149" opacity="0.7">→</text>
<rect x="150" y="18" width="100" height="72" rx="6" fill="#f8514922" stroke="#f85149" stroke-width="2"/>
<text x="200" y="38" text-anchor="middle" font-size="9" fill="#f85149" font-weight="700">NEW PROJECT</text>
<text x="200" y="53" text-anchor="middle" font-size="8" fill="#f85149">~Similar scope</text>
<text x="200" y="67" text-anchor="middle" font-size="8" fill="#f85149">Est: ~$420K</text>
<text x="200" y="81" text-anchor="middle" font-size="8" fill="#f85149">Est: ~9 months</text>
<text x="130" y="108" text-anchor="middle" font-size="8.5" fill="#8b949e">ROM accuracy: −25% to +75%</text>
</svg>`},

{id:'parametric-estimating',name:'Parametric Estimating',tagline:'Unit rate × quantity — scalable and repeatable',
category:'estimating',
usedIn:['6.4','7.2'],
desc:'Uses a statistical relationship between historical data and other variables (unit rate × quantity) to calculate an estimate. More accurate than analogous estimating when a reliable unit rate exists.',
when:'Estimating activity durations or costs when unit rates are known — e.g. $X per line of code, Y hours per test case.',
tip:'The model is only as good as its historical data. A parametric estimate for a novel technology may be wildly inaccurate if the unit rate is guessed.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="130" y="14" text-anchor="middle" font-size="10" fill="#f85149" font-weight="700">UNIT RATE × QUANTITY</text>
${[['Lines of Code','5,000 LOC','× $12/LOC','= $60,000'],['Test Cases','200 tests','× 2 hrs/test','= 400 hrs'],['Story Points','120 pts','× 0.5 days/pt','= 60 days']].map(([label,qty,rate,result],i)=>`
<rect x="10" y="${22+i*27}" width="240" height="22" rx="4" fill="${i%2?'#161b22':'#1a1f26'}" stroke="#f8514933"/>
<text x="16" y="${36+i*27}" font-size="8.5" fill="#8b949e">${label}</text>
<text x="100" y="${36+i*27}" font-size="9" fill="#f0b429" font-weight="600">${qty}</text>
<text x="152" y="${36+i*27}" font-size="9" fill="#58a6ff">${rate}</text>
<text x="230" y="${36+i*27}" text-anchor="end" font-size="9" fill="#f85149" font-weight="700">${result}</text>
`).join('')}
<rect x="10" y="105" width="240" height="8" rx="3" fill="#f8514922"/>
<text x="130" y="112" text-anchor="middle" font-size="8" fill="#f85149" font-weight="600">Total Estimate: $60K + 460 hrs</text>
</svg>`},

{id:'bottom-up-estimating',name:'Bottom-Up Estimating',tagline:'Sum individual work packages — most accurate',
category:'estimating',
usedIn:['6.4','7.2'],
desc:'Estimating individual work packages or activities in detail, then rolling them up to arrive at a total project estimate. The most accurate estimating technique but also the most time-consuming.',
when:'Later in planning when the WBS is fully decomposed and accurate estimates are required for the cost and schedule baselines.',
tip:'Bottom-up = most accurate but most time-consuming. The accuracy depends entirely on how well the work is decomposed — garbage decomposition = garbage estimate.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<rect x="90" y="6" width="80" height="18" rx="4" fill="#f8514933" stroke="#f85149" stroke-width="1.5"/>
<text x="130" y="18" text-anchor="middle" font-size="9" fill="#f85149" font-weight="700">PROJECT $285K</text>
<line x1="130" y1="24" x2="65" y2="36" stroke="#8b949e" stroke-width="1"/>
<line x1="130" y1="24" x2="195" y2="36" stroke="#8b949e" stroke-width="1"/>
<rect x="22" y="36" width="86" height="16" rx="3" fill="#f0b42922" stroke="#f0b429" stroke-width="1.2"/>
<text x="65" y="47" text-anchor="middle" font-size="8.5" fill="#f0b429">Phase 1: $120K</text>
<rect x="152" y="36" width="86" height="16" rx="3" fill="#3fb95022" stroke="#3fb950" stroke-width="1.2"/>
<text x="195" y="47" text-anchor="middle" font-size="8.5" fill="#3fb950">Phase 2: $165K</text>
<line x1="65" y1="52" x2="40" y2="64" stroke="#8b949e" stroke-width="0.8"/>
<line x1="65" y1="52" x2="90" y2="64" stroke="#8b949e" stroke-width="0.8"/>
<line x1="195" y1="52" x2="170" y2="64" stroke="#8b949e" stroke-width="0.8"/>
<line x1="195" y1="52" x2="220" y2="64" stroke="#8b949e" stroke-width="0.8"/>
${[['$30K',15,64,'#58a6ff'],['$90K',68,64,'#58a6ff'],['$75K',143,64,'#58a6ff'],['$90K',197,64,'#58a6ff']].map(([v,x,y,c])=>`
<rect x="${x}" y="${y}" width="44" height="14" rx="2" fill="${c}22" stroke="${c}" stroke-width="0.8"/>
<text x="${x+22}" y="${y+10}" text-anchor="middle" font-size="8" fill="${c}">${v}</text>
`).join('')}
<text x="130" y="94" text-anchor="middle" font-size="9" fill="#8b949e">↑ Roll-up: individual → total</text>
<text x="130" y="108" text-anchor="middle" font-size="8.5" fill="#f85149">Most accurate. Requires full WBS.</text>
</svg>`},

{id:'three-point-pert',name:'Three-Point Estimating (PERT)',tagline:'O + 4M + P ÷ 6 — account for uncertainty',
category:'estimating',
usedIn:['6.4','7.2'],
desc:'Uses three estimates — Optimistic (O), Most Likely (M), and Pessimistic (P) — to calculate a weighted average that accounts for uncertainty. PERT formula: E = (O + 4M + P) / 6. Standard deviation: σ = (P−O)/6.',
when:'Estimating activity durations and costs when there is significant uncertainty and you need to model the range of possible outcomes.',
tip:'The PERT formula weighs the Most Likely estimate 4× more than the extremes. For triangular distribution: E = (O+M+P)/3 — no 4× weighting.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<line x1="25" y1="10" x2="25" y2="95" stroke="#30363d" stroke-width="1.5"/>
<line x1="25" y1="95" x2="240" y2="95" stroke="#30363d" stroke-width="1.5"/>
<polyline points="25,92 65,92 85,88 105,72 125,30 145,72 165,88 185,92 240,92" fill="#f8514922" stroke="#f85149" stroke-width="2"/>
<line x1="65" y1="92" x2="65" y2="18" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="65" y="14" text-anchor="middle" font-size="8" fill="#3fb950" font-weight="700">O</text>
<text x="65" y="106" text-anchor="middle" font-size="8" fill="#3fb950">5d</text>
<line x1="125" y1="30" x2="125" y2="18" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="125" y="14" text-anchor="middle" font-size="8" fill="#58a6ff" font-weight="700">M</text>
<text x="125" y="106" text-anchor="middle" font-size="8" fill="#58a6ff">10d</text>
<line x1="185" y1="92" x2="185" y2="18" stroke="#f0b429" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="185" y="14" text-anchor="middle" font-size="8" fill="#f0b429" font-weight="700">P</text>
<text x="185" y="106" text-anchor="middle" font-size="8" fill="#f0b429">21d</text>
<rect x="190" y="22" width="65" height="44" rx="4" fill="#21262d" stroke="#30363d"/>
<text x="222" y="37" text-anchor="middle" font-size="8" fill="#8b949e">E=(O+4M+P)/6</text>
<text x="222" y="50" text-anchor="middle" font-size="9" fill="#f85149" font-weight="700">E = 11d</text>
<text x="222" y="62" text-anchor="middle" font-size="7.5" fill="#8b949e">σ=(P−O)/6=2.7</text>
</svg>`},

{id:'tcpi',name:'To-Complete Performance Index (TCPI)',tagline:'Required future efficiency to hit your target',
category:'estimating',
usedIn:['7.4'],
desc:'TCPI measures the cost performance that must be achieved on the remaining work to meet a specified management goal (BAC or EAC). TCPI = (BAC−EV) / (BAC−AC). A TCPI > 1.1 is often considered unrealistic.',
when:'Control Costs — when the sponsor asks "can we still finish within budget?" after current performance has deviated from plan.',
tip:'TCPI > 1.0 means you need to work MORE efficiently than you have been. If current CPI is 0.8 and TCPI is 1.2, recovery is essentially impossible without scope reduction.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="130" y="13" text-anchor="middle" font-size="10" fill="#f85149" font-weight="700">TCPI FORMULA</text>
<rect x="10" y="20" width="240" height="28" rx="5" fill="#21262d" stroke="#f85149" stroke-width="1.5"/>
<text x="130" y="33" text-anchor="middle" font-size="9.5" fill="#c9d1d9">TCPI = (BAC − EV) / (BAC − AC)</text>
<text x="130" y="44" text-anchor="middle" font-size="8.5" fill="#8b949e">Work remaining ÷ Budget remaining</text>
<rect x="10" y="54" width="115" height="38" rx="4" fill="#3fb95022" stroke="#3fb950" stroke-width="1.2"/>
<text x="67" y="68" text-anchor="middle" font-size="8.5" fill="#3fb950" font-weight="700">TCPI = 0.95</text>
<text x="67" y="80" text-anchor="middle" font-size="8" fill="#3fb950">Slightly easier — on track</text>
<rect x="135" y="54" width="115" height="38" rx="4" fill="#f8514922" stroke="#f85149" stroke-width="1.2"/>
<text x="192" y="68" text-anchor="middle" font-size="8.5" fill="#f85149" font-weight="700">TCPI = 1.25</text>
<text x="192" y="80" text-anchor="middle" font-size="8" fill="#f85149">Unrealistic — replan needed</text>
<text x="130" y="108" text-anchor="middle" font-size="8" fill="#8b949e">CPI > 1 = under budget | TCPI > 1 = need more efficiency</text>
</svg>`},

// ─── INTERPERSONAL & TEAM ─────────────────────────────────────────────
{id:'conflict-management',name:'Conflict Management',tagline:'5 modes — choose the right one for the situation',
category:'interpersonal',
usedIn:['9.5'],
desc:'A set of five techniques for resolving disagreements: Collaborate/Problem-Solve (win-win, preferred), Compromise/Reconcile (lose-lose), Smooth/Accommodate (yield), Force/Direct (win-lose), Withdraw/Avoid (lose-lose, worst).',
when:'Manage Team — whenever interpersonal conflicts arise between project team members, stakeholders, or functional managers.',
tip:'Collaborate/Problem-Solve is the BEST conflict resolution method per PMBOK. Withdraw/Avoid is the WORST — it never resolves the underlying issue.',
visual:()=>`<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<line x1="30" y1="10" x2="30" y2="100" stroke="#30363d" stroke-width="1.5"/>
<line x1="30" y1="100" x2="240" y2="100" stroke="#30363d" stroke-width="1.5"/>
<text x="135" y="110" text-anchor="middle" font-size="8" fill="#8b949e">Concern for Others →</text>
<text x="14" y="55" font-size="8" fill="#8b949e" writing-mode="vertical-rl">Self →</text>
${[['Collaborate\n★ Best',195,20,'#3fb950'],['Compromise',195,60,'#f0b429'],['Force',50,20,'#f85149'],['Smooth',50,60,'#58a6ff'],['Avoid\n✗ Worst',50,90,'#8b949e']].map(([label,x,y,c])=>`
<circle cx="${x}" cy="${y}" r="12" fill="${c}33" stroke="${c}" stroke-width="${label.includes('★')?2:1}"/>
<text x="${x}" y="${y+(label.includes('\n')?-2:4)}" text-anchor="middle" font-size="7" fill="${c}" font-weight="${label.includes('★')?'700':'400'}">${label.split('\n')[0]}</text>
${label.includes('\n')?`<text x="${x}" y="${y+8}" text-anchor="middle" font-size="7" fill="${c}" font-weight="700">${label.split('\n')[1]}</text>`:''}
`).join('')}
</svg>`},

{id:'negotiation',name:'Negotiation',tagline:'Reach mutually acceptable agreements',
category:'interpersonal',
usedIn:['9.3','12.2'],
desc:'A discussion aimed at reaching an agreement. In project management, used with team members to agree on responsibilities, with vendors on contract terms, and with functional managers for resource assignments.',

<text x="55" y="73" text-anchor="middle" font-size="7.5" fill="#58a6ff">Interest: timeline</text>
<rect x="160" y="22" width="90" height="70" rx="8" fill="#3fb95022" stroke="#3fb950" stroke-width="1.5"/>
<text x="205" y="46" text-anchor="middle" font-size="9" fill="#3fb950" font-weight="700">Party B</text>
<text x="205" y="60" text-anchor="middle" font-size="8" fill="#8b949e">Position: $80K</text>
<text x="205" y="73" text-anchor="middle" font-size="7.5" fill="#3fb950">Interest: quality</text>
<rect x="88" y="38" width="84" height="36" rx="6" fill="#f0b42922" stroke="#f0b429" stroke-width="1.5"/>
<text x="130" y="54" text-anchor="middle" font-size="8.5" fill="#f0b429" font-weight="700">AGREEMENT</text>
<text x="130" y="67" text-anchor="middle" font-size="8" fill="#8b949e">$90K + SLA</text>
<text x="130" y="108" text-anchor="middle" font-size="8.5" fill="#f0b429">Focus on interests, not positions</text>
</svg>`},

{id:'emotional-intelligence',name:'Emotional Intelligence (EI)',tagline:'Self-awareness + empathy = better leadership',
category:'interpersonal',
usedIn:['9.5'],
desc:'The ability to identify, assess, and manage the personal emotions of oneself and of others. High-EI project managers build stronger teams, resolve conflicts more effectively, and inspire greater commitment.',

${[['Self-Awareness',130,12,'#38bcd6'],['Self-Management',220,58,'#3fb950'],['Social Awareness',130,105,'#58a6ff'],['Relationship Mgmt',40,58,'#f0b429']].map(([label,x,y,c])=>`

{id:'facilitation',name:'Facilitation',tagline:'Guide groups to productive outcomes',
category:'interpersonal',

{id:'tornado-diagram',name:'Tornado Diagram',tagline:'Ranked sensitivity bars — widest = biggest risk driver',
category:'data-representation',
usedIn:['11.4'],
desc:'A bar chart from sensitivity analysis where variables are ranked by their impact range — widest bars on top, narrowest on the bottom, creating a tornado shape. Shows which uncertain inputs drive the most variance in the project outcome.',
when:'Perform Quantitative Risk Analysis — after a sensitivity analysis, to communicate which variables have the greatest potential effect on the project objective (e.g., NPV or project cost).',
tip:'The wider the bar, the more that variable can swing the result. Focus response planning on the top 2-3 variables. The tornado shape gives it its name.',
visual:()=>{
  const vars=[['Market Demand',36,100],['Labor Cost',50,95],['Vendor Price',64,90],['Tech Complexity',76,88],['Scope Changes',88,86]];
  const lo=30,hi=110,base=70,ox=80,tw=150;
  return `<svg viewBox="0 0 260 115" width="260" height="115" xmlns="http://www.w3.org/2000/svg" style="font-family:system-ui,sans-serif">
<text x="130" y="11" text-anchor="middle" font-size="9" fill="#f0b429" font-weight="700">SENSITIVITY (Impact on NPV)</text>
<line x1="${ox+(base-lo)/(hi-lo)*tw}" y1="13" x2="${ox+(base-lo)/(hi-lo)*tw}" y2="105" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="${ox+(base-lo)/(hi-lo)*tw}" y="113" text-anchor="middle" font-size="7.5" fill="#8b949e">Base</text>
${vars.map(([label,l,h],i)=>{
  const bx=ox+(l-lo)/(hi-lo)*tw;
  const bw=(h-l)/(hi-lo)*tw;
  const y=16+i*17;
  const c=i===0?'#f85149':i===1?'#f0b429':'#58a6ff';
  return `<rect x="${bx}" y="${y}" width="${bw}" height="13" rx="2" fill="${c}44" stroke="${c}" stroke-width="1"/>
<text x="${ox-2}" y="${y+9}" text-anchor="end" font-size="8" fill="#c9d1d9">${label}</text>`;
}).join('')}
</svg>`;
}},

{id:'leads-lags',name:'Leads & Lags',tagline:'Lead = overlap; Lag = mandatory wait between activities',
category:'scheduling',
usedIn:['6.3','6.5'],
desc:'A Lead allows a successor activity to start before its predecessor finishes (negative lag / acceleration). A Lag adds a deliberate waiting period between activities (positive delay). Both refine schedule network logic beyond simple dependency types.',

// ─────────────────────────────────────────────────────────────────────
//  FILTER CHIPS — SIDEBAR
// ─────────────────────────────────────────────────────────────────────
function buildFilterChips() {
  // Process group chips
  const pgEl = document.getElementById('pg-chips');
  PG_ORDER.forEach(pg => {
    const btn = document.createElement('button');
    btn.className = 'chip active';
    btn.dataset.pg = pg;
    const c = PG_COLOR[pg];
    btn.style.borderColor = c.border;
    btn.style.color = c.label;
    btn.innerHTML = `<span>${pg}</span>`;
    btn.addEventListener('click', () => {
      if (state.activeGroups.has(pg)) { state.activeGroups.delete(pg); btn.classList.remove('active'); btn.style.opacity='0.45'; }
      else { state.activeGroups.add(pg); btn.classList.add('active'); btn.style.opacity='1'; }
      applyFilters();
    });
    pgEl.appendChild(btn);
  });

  // KA chips
  const kaEl = document.getElementById('ka-chips');
  KA_ORDER.forEach(ka => {
    const btn = document.createElement('button');
    btn.className = 'chip active';
    btn.dataset.ka = ka;
    btn.style.borderColor = KA_COLOR[ka] + '80';
    btn.style.color = KA_COLOR[ka];
    btn.innerHTML = `<span class="dot" style="background:${KA_COLOR[ka]}"></span><span style="font-size:10px">${ka.replace('Communications','Comms')}</span>`;
    btn.addEventListener('click', () => {
      if (state.activeKAs.has(ka)) { state.activeKAs.delete(ka); btn.classList.remove('active'); btn.style.opacity='0.4'; }
      else { state.activeKAs.add(ka); btn.classList.add('active'); btn.style.opacity='1'; }
      applyFilters();
    });
    kaEl.appendChild(btn);
  });

  // Display checkboxes
  document.getElementById('chk-edges').addEventListener('change', e => {
    state.showEdges = e.target.checked;
    d3.selectAll('.edge-layer').attr('display', state.showEdges ? null : 'none');
  });
  document.getElementById('chk-milestones').addEventListener('change', e => {
    state.showMilestones = e.target.checked;
    d3.selectAll('.milestone-badge').attr('display', state.showMilestones ? null : 'none');
  });
  document.getElementById('chk-color-pg').addEventListener('change', e => {
    state.colorByPG = e.target.checked;
    refreshView();
  });
}

function applyFilters() {
  if (state.view === 'flow')     applyFlowFilters();
  if (state.view === 'matrix')   renderMatrix();
  if (state.view === 'timeline') renderTimeline();
}

// ═══════════════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════════════
const searchEl = document.getElementById('search');
let searchTimer;
searchEl.addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.searchQuery = e.target.value.trim();
    applyFilters();
  }, 150);
});

// ═══════════════════════════════════════════════════════════════════
//  VIEW SWITCHING
// ═══════════════════════════════════════════════════════════════════
function switchView(viewId) {
  const sidebar = document.getElementById('sidebar');
  const strip   = document.getElementById('milestone-strip');
  const isMob   = window.innerWidth <= 768;

  // Views where sidebar + milestone strip are always visible
  const primaryViews = ['flow', 'timeline'];
  const leaving = state.view;
  const entering = viewId;

  // Leaving a primary view → save sidebar state before hiding
  if (primaryViews.includes(leaving) && !primaryViews.includes(entering)) {
    state.sidebarWasCollapsed = isMob
      ? !sidebar.classList.contains('mobile-open')
      : sidebar.classList.contains('collapsed');
    // Auto-hide
    if (isMob) {
      sidebar.classList.remove('mobile-open');
      document.getElementById('sidebar-overlay').classList.remove('visible');
    } else {
      sidebar.classList.add('collapsed');
    }
    strip.style.display = 'none';
  }

  // Entering a primary view → restore sidebar state + show strip
  if (!primaryViews.includes(leaving) && primaryViews.includes(entering)) {
    if (isMob) {
      // on mobile leave sidebar closed unless user opens it
    } else {
      if (!state.sidebarWasCollapsed) sidebar.classList.remove('collapsed');
    }
    strip.style.display = '';
  }

  state.view = viewId;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.vtab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${viewId}`).classList.add('active');
  document.querySelector(`.vtab[data-view="${viewId}"]`).classList.add('active');
  if (viewId === 'flow' && document.querySelector('#flow-svg-wrap svg') === null) renderFlowchart();
  if (viewId === 'matrix') renderMatrix();
  if (viewId === 'timeline') renderTimeline();
  if (viewId === 'ka') renderKA();
  if (viewId === 'tools') renderTools();
}

document.querySelectorAll('.vtab').forEach(tab => {
  tab.addEventListener('click', () => switchView(tab.dataset.view));
});

function refreshView() {
  const v = state.view;
  if (v === 'flow')     { document.getElementById('flow-svg-wrap').innerHTML = ''; renderFlowchart(); }
  if (v === 'matrix')   renderMatrix();
  if (v === 'timeline') renderTimeline();
  if (v === 'ka')       renderKA();
  if (v === 'tools')    renderTools();
}

// ═══════════════════════════════════════════════════════════════════
//  TOOLS REFERENCE TAB
// ═══════════════════════════════════════════════════════════════════
const TOOL_CAT_COLOR = {
  'data-gathering':   '#3fb950',
  'data-analysis':    '#58a6ff',
  'data-representation': '#f0b429',
  'scheduling':       '#bc8cff',
  'estimating':       '#f85149',
  'interpersonal':    '#38bcd6',
  'governance':       '#8b949e'
};

function renderTools() {
  const q = (document.getElementById('tools-search').value || '').toLowerCase().trim();
  const activeChip = document.querySelector('.tcat-chip.active');
  const activeCat  = activeChip ? activeChip.dataset.cat : 'all';

  const filtered = TOOLS.filter(t => {
    const catMatch = activeCat === 'all' || t.category === activeCat;
    const qMatch   = !q ||
      t.name.toLowerCase().includes(q) ||
      t.desc.toLowerCase().includes(q) ||
      t.tagline.toLowerCase().includes(q) ||
      t.when.toLowerCase().includes(q);
    return catMatch && qMatch;
  });

  const count = document.getElementById('tools-count');
  if (count) count.textContent = `${filtered.length} tool${filtered.length !== 1 ? 's' : ''}`;

  const grid = document.getElementById('tools-grid');
  if (!grid) return;

  grid.innerHTML = filtered.map((t, i) => {
    const c = TOOL_CAT_COLOR[t.category] || '#8b949e';
    const label = CAT_LABEL[t.category] || t.category;
    const svg = typeof t.visual === 'function' ? t.visual() : (t.visual || '');
    const usedInHtml = t.usedIn && t.usedIn.length
      ? `<div class="tool-usedin">Used in: ${t.usedIn.map(id => {
          const p = PROCESSES.find(x => x.id === id);
          return p ? `<span class="tool-pid" title="${p.name}">${id}</span>` : `<span class="tool-pid">${id}</span>`;
        }).join('')}</div>`
      : '';
    return `
    <div class="tool-card" style="animation-delay:${i * 0.03}s">
      <div class="tool-card-head">
        <span class="tool-cat-badge" style="background:${c}22;color:${c};border:1px solid ${c}44">${label}</span>
      </div>
      <div class="tool-name-row">
        <div class="tool-name">${t.name}</div>
        <div class="tool-tagline">${t.tagline}</div>
      </div>
      <div class="tool-visual">${svg}</div>
      <div class="tool-body">
        <div class="tool-desc">${t.desc}</div>
        <div class="tool-when"><strong>When to use:</strong> ${t.when}</div>
        ${usedInHtml}
        <div class="tool-tip">${t.tip}</div>
      </div>
    </div>`;
  }).join('');
}

// wire up tools tab search + category chips
(function initToolsEvents() {
  const searchEl = document.getElementById('tools-search');
  if (searchEl) searchEl.addEventListener('input', () => { if (state.view === 'tools') renderTools(); });

  document.getElementById('tools-cat-chips').addEventListener('click', e => {
    const chip = e.target.closest('.tcat-chip');
    if (!chip) return;
    document.querySelectorAll('.tcat-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    if (state.view === 'tools') renderTools();
  });
})();

// ═══════════════════════════════════════════════════════════════════
//  MATRIX FILTER BUTTONS
// ═══════════════════════════════════════════════════════════════════
document.getElementById('mf-all').addEventListener('click', function() {
  setMatrixFilter('all', this);
});
document.getElementById('mf-input').addEventListener('click', function() {
  setMatrixFilter('input', this);
});
document.getElementById('mf-output').addEventListener('click', function() {
  setMatrixFilter('output', this);
});
function setMatrixFilter(mode, btn) {
  document.querySelectorAll('#matrix-filter-btns .chip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const wrap = document.getElementById('matrix-wrap');
  wrap.dataset.filter = mode;
  const table = document.getElementById('matrix-table');
  if (!table) return;
  table.querySelectorAll('tbody td:not(:first-child)').forEach(td => {
    if (mode === 'all') { td.style.display = ''; return; }
    const isInput  = td.classList.contains('cell-i') || td.classList.contains('cell-io');
    const isOutput = td.classList.contains('cell-o') || td.classList.contains('cell-io');
    td.style.display = (mode === 'input' && isInput) || (mode === 'output' && isOutput) || td.textContent === '' ? '' : 'none';
    if (mode !== 'all' && !isInput && !isOutput) td.style.display = '';
  });
}

// ═══════════════════════════════════════════════════════════════════
//  THEME TOGGLE
// ═══════════════════════════════════════════════════════════════════
document.getElementById('theme-btn').addEventListener('click', function() {
  const html = document.documentElement;
  const isDark = html.dataset.theme === 'dark';
  html.dataset.theme = isDark ? 'light' : 'dark';
  this.textContent = isDark ? '☾' : '☀';
});

// ═══════════════════════════════════════════════════════════════════
//  RESET
// ═══════════════════════════════════════════════════════════════════
document.getElementById('reset-btn').addEventListener('click', () => {
  PG_ORDER.forEach(pg => state.activeGroups.add(pg));
  KA_ORDER.forEach(ka => state.activeKAs.add(ka));
  state.searchQuery = '';
  searchEl.value = '';
  state.colorByPG = false;
  document.getElementById('chk-color-pg').checked = false;
  document.querySelectorAll('.chip').forEach(c => { c.classList.add('active'); c.style.opacity='1'; });
  applyFilters();
  closePanel();
});

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
function init() {
  buildMilestoneStrip();
  buildFilterChips();
  renderFlowchart();
}

// Wait for D3 to be available
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
